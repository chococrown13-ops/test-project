<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:P;font-weight:400;src:url(file:///home/user/test-project/gunggeum/tools/fonts/Pretendard-Regular.otf)}
@font-face{font-family:P;font-weight:600;src:url(file:///home/user/test-project/gunggeum/tools/fonts/Pretendard-SemiBold.otf)}
@font-face{font-family:P;font-weight:800;src:url(file:///home/user/test-project/gunggeum/tools/fonts/Pretendard-ExtraBold.otf)}
html,body{margin:0;background:#000}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// 도시의 나이테 · 원래 ○○이었다 #6 「강남은 원래 논밭이었다」 — render(t) 한 번 = 한 프레임.
// 단위 km. x 동쪽, y 북쪽. 논·도로·건물 배치는 기록을 바탕으로 단순화한 그림(실제 지형 아님).
const W=1080,H=1920;
const cv=document.getElementById('c'),g=cv.getContext('2d');
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(a,b){let h=(a*374761393+b*668265263)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967296}
const lerp=(a,b,u)=>a+(b-a)*u,clamp01=x=>Math.max(0,Math.min(1,x));
function smooth(a,b,t){const u=clamp01((t-a)/(b-a));return u*u*(3-2*u)}
const mix=(a,b,u)=>a.map((v,i)=>v+(b[i]-v)*u),rgb=(c,a)=>a===undefined?`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`:`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
function path(p){g.beginPath();g.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)g.lineTo(p[i][0],p[i][1])}
function roundRect(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

// ---------- 지도 ----------
const XMIN=-4.6,XMAX=4.6,YMIN=-3.0,YMAX=3.0;
const riverY=x=>2.55+0.28*Math.sin(x*0.55+0.8);       // 북쪽 한강(단순화)
const AREA=[[-3.7,-2.2],[3.9,-2.3],[4.0,1.6],[1.8,2.1],[-1.2,1.9],[-3.6,1.3]];   // 편입 땅(단순화한 윤곽)
const ZONE=[-3.0,-1.7,3.3,1.5];                        // 구획정리 지구(x0,y0,x1,y1)
const XS=0.9,YS=0.7;                                    // 도로 격자 간격
function inPoly(p,Pl){let c=false;for(let i=0,j=Pl.length-1;i<Pl.length;j=i++){const a=Pl[i],b=Pl[j];if((a[1]>p[1])!==(b[1]>p[1])&&p[0]<(b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1])+a[0])c=!c}return c}

// ---------- 시간표 ----------
let T=0,old=0,hl=0,gridP=0,roadP=0,rise=0,rise2=0;
function setState(t){
  T=t;
  old=smooth(3.0,4.8,t);          // 지금 → 1960년대 논밭으로 되감기
  hl=Math.min(smooth(5.6,6.8,t),1-smooth(9.0,10.0,t)); // 1963 편입 윤곽 반짝
  gridP=smooth(10.0,15.0,t);      // 1966 구획선이 그려짐
  roadP=smooth(16.0,19.5,t);      // 1968 도로가 깔림
  rise=smooth(19.8,26.2,t);       // 건물이 솟음(1968~1975)
}
const FIELD=[[112,140,78],[124,150,86],[150,148,92],[98,128,74],[168,154,100]],RIDGE=[70,92,52],URBAN=[26,32,52],ROAD=[58,64,86],WATER=[30,66,118],WATER_OLD=[52,98,150];
function isRoadAt(x,y,k){
  // k: 도로 진행(0~1) — 가운데에서 바깥으로
  const dc=Math.hypot((x-0.2)/4,(y+0.2)/2.2);
  if(dc>k*1.15) return 0;
  const mx=((x%XS)+XS)%XS,my=((y%YS)+YS)%YS;
  const main=Math.abs(y-0.0)<0.075;
  if(main) return 2;
  if(mx<0.06||my<0.055) return 1;
  return 0;
}
function cellColor(cx,cy){
  const water=cy>riverY(cx);
  const farmK=old*(1-rise);
  if(water) return mix(WATER,WATER_OLD,old*(1-rise));
  // 논: 불규칙한 직사각형(줄마다 어긋남) + 논두렁
  const row=Math.floor(cy/0.26),off=hash(row,7)*0.5;
  const col=Math.floor((cx+off)/0.46);
  const fx=((cx+off)/0.46)-col,fy=(cy/0.26)-row;
  let f=FIELD[Math.floor(hash(col,row)*FIELD.length)];
  if(fx<0.07||fy<0.1) f=RIDGE;
  // 지금의 도시 바닥
  let base=mix(URBAN,[40,46,70],hash(Math.floor(cx*4),Math.floor(cy*4))*0.5);
  // 도로 판정(1968 이후)
  const rd=isRoadAt(cx,cy,Math.max(roadP,1-old));
  let col2=mix(base,f,farmK*(1-roadP*0.0));
  // 구획선(1966): 구역 안에 가는 노란 선이 격자로
  if(old>0.5&&gridP>0){
    const inZ=cx>ZONE[0]&&cx<ZONE[2]&&cy>ZONE[1]&&cy<ZONE[3];
    if(inZ){const dx=Math.abs(cx-(ZONE[0]+gridP*(ZONE[2]-ZONE[0])))
      ;const mx=((cx%XS)+XS)%XS,my=((cy%YS)+YS)%YS;
      const reveal=(cx-ZONE[0])/(ZONE[2]-ZONE[0])<=gridP;
      if(reveal&&(mx<0.045||my<0.04)) col2=mix(col2,[255,213,74],0.9*(1-roadP));
    }
  }
  if(rd&&old>0.5){ col2=mix(col2,rd===2?[92,98,126]:ROAD,clamp01(roadP*1.6)); }
  if(rd&&old<=0.5){ col2=mix(col2,rd===2?[92,98,126]:ROAD,1-old*2); }
  return col2;
}

// ---------- 건물 ----------
const R=rng(1975),B=[];
for(let gx=-4.3;gx<=4.3;gx+=0.3)for(let gy=-2.7;gy<=2.7;gy+=0.24){
  const x=gx+(R()-.5)*.12,y=gy+(R()-.5)*.1;
  if(y>riverY(x)-0.25) continue;
  const mx=((x%XS)+XS)%XS,my=((y%YS)+YS)%YS;
  if(mx<0.14||my<0.12||Math.abs(y)<0.16) continue;
  if(R()>0.78) continue;
  const d=Math.hypot((x-0.2)/4.6,(y+0.1)/2.6);
  B.push({x,y,s:.09+R()*.07,h:(.04+R()*R()*.2)*(1.6-d*0.9),lit:R(),win:R(),d,delay:d*0.55+R()*0.2});
}

// ---------- 카메라 ----------
const KEYS=[
 [0.0,-6.0,-5.0,5.6, 0.0,0.2],
 [3.0,-5.2,-4.6,5.2, 0.0,0.0],
 [6.0,-1.0,-6.4,4.3, 0.2,0.0],
 [10.0,3.6,-4.2,3.6, 0.4,0.0],
 [16.0,4.4,-0.6,3.2, -0.2,0.2],
 [20.0,-3.0,-3.6,3.3, 0.2,0.3],
 [24.0,-1.0,-6.0,4.6, 0.2,0.0],
 [27.6,0.0,-9.0,8.2, 0.0,0.4],
 [30.0,0.0,-10.0,9.0, 0.0,0.5]];
function catmull(p0,p1,p2,p3,u){const u2=u*u,u3=u2*u;return .5*((2*p1)+(-p0+p2)*u+(2*p0-5*p1+4*p2-p3)*u2+(-p0+3*p1-3*p2+p3)*u3)}
function camAt(t){let i=0;while(i<KEYS.length-2&&t>KEYS[i+1][0])i++;const k0=KEYS[Math.max(0,i-1)],k1=KEYS[i],k2=KEYS[i+1],k3=KEYS[Math.min(KEYS.length-1,i+2)];let u=clamp01((t-k1[0])/(k2[0]-k1[0]));u=u*u*(3-2*u)*.35+u*.65;const o=[];for(let j=1;j<6;j++)o.push(catmull(k0[j],k1[j],k2[j],k3[j],u));return o}
let C,Fv,Rv,Uv;const FOC=W*1.05;
function setCam(t){const[cx,cy,cz,tx,ty]=camAt(t);C=[cx,cy,cz];let f=[tx-cx,ty-cy,-cz],n=Math.hypot(...f);Fv=f.map(v=>v/n);let r=[Fv[1],-Fv[0],0];n=Math.hypot(...r);Rv=r.map(v=>v/n);Uv=[Rv[1]*Fv[2]-Rv[2]*Fv[1],Rv[2]*Fv[0]-Rv[0]*Fv[2],Rv[0]*Fv[1]-Rv[1]*Fv[0]]}
function P(x,y,z){const d=[x-C[0],y-C[1],(z||0)-C[2]];const zz=d[0]*Fv[0]+d[1]*Fv[1]+d[2]*Fv[2];if(zz<.08)return null;const xx=d[0]*Rv[0]+d[1]*Rv[1]+d[2]*Rv[2],yy=d[0]*Uv[0]+d[1]*Uv[1]+d[2]*Uv[2];return[W/2+xx/zz*FOC,H*.57-yy/zz*FOC,zz]}
function skyLow(){return mix([20,28,56],[176,170,140],old*(1-rise*0.9))}
function fog(col,z){return mix(col,skyLow(),clamp01((z-3.5)/26)*.85)}

function drawSky(){
  const top=mix([6,9,24],[96,132,170],old*(1-rise*0.9));
  const gr=g.createLinearGradient(0,0,0,H*.6);gr.addColorStop(0,rgb(top));gr.addColorStop(1,rgb(skyLow()));g.fillStyle=gr;g.fillRect(0,0,W,H);
  const night=1-old*(1-rise*0.9);if(night>0.1){const rs=rng(3);g.fillStyle=`rgba(255,255,255,${.5*night})`;for(let i=0;i<110;i++)g.fillRect(rs()*W,rs()*H*.42,2,2)}
}
function drawGround(){
  for(let x=-18;x<20;x+=2.5)for(let y=-16;y<18;y+=2.5){const a=P(x,y),b=P(x+2.5,y),c=P(x+2.5,y+2.5),d=P(x,y+2.5);if(!a||!b||!c||!d)continue;
    g.fillStyle=rgb(fog(mix(URBAN,[120,140,90],old*(1-rise)),(a[2]+c[2])/2));path([a,b,c,d]);g.closePath();g.fill()}
  const S=0.13;
  for(let x=XMIN;x<XMAX;x+=S)for(let y=YMIN;y<YMAX;y+=S){
    const cx=x+S/2,cy=y+S/2,col=cellColor(cx,cy);
    const a=P(x,y),b=P(x+S,y),c=P(x+S,y+S),d=P(x,y+S);if(!a||!b||!c||!d)continue;
    g.fillStyle=rgb(fog(col,a[2]));path([a,b,c,d]);g.closePath();g.fill();
  }
}
function drawArea(){
  if(hl<=0)return;
  const pts=AREA.map(p=>P(p[0],p[1],0.02));if(pts.some(v=>!v))return;
  g.fillStyle=`rgba(255,213,74,${.16*hl})`;path(pts);g.closePath();g.fill();
  g.strokeStyle=`rgba(255,213,74,${hl})`;g.lineWidth=10;g.lineJoin='round';path(pts);g.closePath();g.stroke();
}
function drawZone(){
  const a=Math.min(smooth(10.0,10.8,T),1-smooth(15.8,16.6,T));if(a<=0)return;
  const c=[[ZONE[0],ZONE[1]],[ZONE[2],ZONE[1]],[ZONE[2],ZONE[3]],[ZONE[0],ZONE[3]]].map(p=>P(p[0],p[1],0.02));if(c.some(v=>!v))return;
  g.strokeStyle=`rgba(255,213,74,${.9*a})`;g.lineWidth=8;g.setLineDash([26,18]);path(c);g.closePath();g.stroke();g.setLineDash([]);
}
function prism(b){
  const k=old>0.5? smooth(b.delay*0.9,b.delay*0.9+0.45,rise*1.6) : lerp(0,1,1-old);
  if(k<0.02)return;
  const kk=old>0.5?k:Math.min(1,(1-old)*(1-old*0));
  const h=b.h*kk,s=b.s/2,base=[[b.x-s,b.y-s],[b.x+s,b.y-s],[b.x+s,b.y+s],[b.x-s,b.y+s]];
  const pb=base.map(p=>P(p[0],p[1],0)),pt=base.map(p=>P(p[0],p[1],h));if(pb.some(v=>!v)||pt.some(v=>!v))return;
  const z=pb[0][2],body=[34+b.win*16,40+b.win*16,62+b.win*20];
  for(const[i,j]of[[0,1],[1,2],[2,3],[3,0]]){const mx=(base[i][0]+base[j][0])/2,my=(base[i][1]+base[j][1])/2,ex=base[j][0]-base[i][0],ey=base[j][1]-base[i][1];if(ey*(C[0]-mx)-ex*(C[1]-my)<=0)continue;
    g.fillStyle=rgb(fog(body.map(v=>v*(i%2?.8:1)),z));path([pb[i],pb[j],pt[j],pt[i]]);g.closePath();g.fill();
    if(b.lit>.3&&kk>.5){const rw=rng((b.x*1000+b.y*77+i)|0);g.fillStyle=rgb(fog([255,214,140],z),.85*kk);const n=Math.min(9,2+Math.floor(h*30));for(let q=0;q<n;q++){const u=.15+rw()*.7,v=.1+rw()*.85;g.fillRect(lerp(lerp(pb[i][0],pb[j][0],u),lerp(pt[i][0],pt[j][0],u),v),lerp(lerp(pb[i][1],pb[j][1],u),lerp(pt[i][1],pt[j][1],u),v),Math.max(1.4,.016*FOC/z),Math.max(1.8,.022*FOC/z))}}}
  g.fillStyle=rgb(fog([52+b.win*20,58+b.win*20,84+b.win*20],z));path(pt);g.closePath();g.fill();
}
function label(text,p,z,alpha,accent){const q=P(p[0],p[1],z||.05);if(!q||alpha<=0)return;g.font='800 34px P';const w=g.measureText(text).width+32;
  g.fillStyle=accent?`rgba(255,213,74,${.95*alpha})`:`rgba(10,14,28,${.78*alpha})`;roundRect(q[0]-w/2,q[1]-70,w,52,26);g.fill();g.fillStyle=accent?`rgba(27,20,48,${alpha})`:`rgba(255,255,255,${alpha})`;g.textAlign='center';g.fillText(text,q[0],q[1]-33);g.textAlign='left';
  g.strokeStyle=`rgba(255,255,255,${.6*alpha})`;g.lineWidth=2;path([[q[0],q[1]-18],[q[0],q[1]]]);g.stroke()}

// ---------- 자막 ----------
const STOPS=[
 {a:5.0,b:9.6,year:'1963',head:'서울이 된 광주군 땅',sub:'1월 1일, 서울 면적이 두 배로',src:'서울신문 · 서울택리지'},
 {a:10.0,b:16.0,year:'1966',head:'800만 평을 반듯하게',sub:'9월, 구획정리 지구 승인',src:'서울신문 · 서울택리지'},
 {a:16.2,b:22.0,year:'1968',head:'영동1지구 개발 시작',sub:'논밭 위로 격자 도로가',src:'서울신문 · 천·지·개·벽 50년'},
 {a:22.2,b:27.4,year:'1975',head:'강남구가 생기다',sub:'10월 1일, 개청 당시 약 32만 명',src:'서울신문 · 강남구청'},
];
function fade(t,a,b){return Math.min(smooth(a,a+.45,t),1-smooth(b-.45,b,t))}
function caption(t){
  const gr=g.createLinearGradient(0,0,0,660);gr.addColorStop(0,'rgba(0,0,0,.6)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,W,660);
  const gb=g.createLinearGradient(0,H-380,0,H);gb.addColorStop(0,'rgba(0,0,0,0)');gb.addColorStop(1,'rgba(0,0,0,.62)');g.fillStyle=gb;g.fillRect(0,H-380,W,380);
  g.font='800 32px P';const tag='도시의 나이테 · 원래 ○○이었다 #6';const tw=g.measureText(tag).width+48;g.fillStyle='rgba(255,213,74,.95)';roundRect(56,72,tw,60,30);g.fill();g.fillStyle='#1b1430';g.fillText(tag,80,113);
  const h=fade(t,0,3.6);if(h>0){g.globalAlpha=h;g.textAlign='center';g.fillStyle='#fff';g.font='800 120px P';g.fillText('강남은',W/2,360);g.fillStyle='#FFD54A';g.fillText('원래 논밭이었다',W/2,500);g.font='600 44px P';g.fillStyle='rgba(255,255,255,.9)';g.fillText('지금은 빌딩 숲인 곳',W/2,590);g.textAlign='left';g.globalAlpha=1}
  const rw=fade(t,3.2,5.2);if(rw>0){const y=Math.round(lerp(2026,1963,smooth(3.2,4.8,t)));g.globalAlpha=rw;g.textAlign='center';g.font='800 170px P';g.fillStyle='#FFD54A';g.fillText(String(y),W/2,340);g.font='600 44px P';g.fillStyle='rgba(255,255,255,.9)';g.fillText('시간을 거꾸로 돌리면',W/2,420);g.textAlign='left';g.globalAlpha=1}
  for(const s of STOPS){const a=fade(t,s.a,s.b);if(a<=0)continue;g.globalAlpha=a;g.textAlign='center';const y0=300+(1-a)*24;
    g.font='800 130px P';g.fillStyle='#FFD54A';g.fillText(s.year,W/2,y0);g.font='800 68px P';g.fillStyle='#fff';g.fillText(s.head,W/2,y0+100);
    g.font='600 44px P';g.fillStyle='rgba(255,255,255,.9)';g.fillText(s.sub,W/2,y0+168);g.font='400 30px P';g.fillStyle='rgba(255,255,255,.8)';g.fillText(s.src,W/2,H-150);g.textAlign='left';g.globalAlpha=1}
  const e=smooth(27.8,28.4,t);if(e>0){g.globalAlpha=e;g.textAlign='center';g.fillStyle='#fff';g.font='800 72px P';g.fillText('다음 편도',W/2,300);g.fillStyle='#FFD54A';g.font='800 80px P';g.fillText('「원래 ○○이었다」',W/2,410);
    g.font='600 42px P';g.fillStyle='rgba(255,255,255,.9)';g.fillText('궁금한 동네를 댓글로 알려 주세요',W/2,500);
    g.font='400 30px P';g.fillStyle='rgba(255,255,255,.8)';g.fillText('논·도로·건물 배치는 기록을 바탕으로 단순화한 그림이에요',W/2,H-150);g.textAlign='left';g.globalAlpha=1}
}

function render(t){
  setState(t);setCam(t);drawSky();drawGround();drawArea();drawZone();
  const list=B.map(b=>({b,d:(b.x-C[0])**2+(b.y-C[1])**2})).sort((p,q)=>q.d-p.d);for(const it of list)prism(it.b);
  label('지금의 강남',[0.2,-0.9],.05,fade(t,0.6,3.2),true);
  label('옛 광주군 땅',[0.2,-0.9],.05,fade(t,6.0,9.4),true);
  label('한강',[-2,riverY(-2)-0.1],.05,fade(t,6.0,9.4));
  label('구획정리 지구',[0.2,-0.9],.05,fade(t,10.6,15.6),true);
  label('도로 격자',[0.2,-0.9],.05,fade(t,17.0,21.6),true);
  label('강남구',[0.2,-0.9],.5,fade(t,23.0,27.0),true);
  caption(t);
}
window.render=render;
window.ready=document.fonts.load('800 40px P').then(()=>document.fonts.load('600 40px P')).then(()=>document.fonts.load('400 40px P')).then(()=>{render(0);return true});
</script></body></html>
