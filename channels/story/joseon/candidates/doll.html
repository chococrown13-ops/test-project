window.ready = (async () => {
  const Q = new URLSearchParams(location.search);
  const S = Story.init({ w: 1920, h: 1080, bg: '#cfe3f2', titleAt: [-9, -8], ss: 1 });
  const names = ['민재', '윤진사', '주모', '순라군', '돌쇠'];

  Object.values(C).forEach((c) => S.scene.add(c.g));
  const fl = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), Story.toon('#b9c9a4')); fl.rotation.x = -Math.PI / 2; fl.receiveShadow = true; S.scene.add(fl);
  names.forEach((n, i) => { C[n].g.position.set((i - 2) * 1.35, 0, 0); C[n].g.rotation.y = -0.15 + (i - 2) * 0.05; });

})();
