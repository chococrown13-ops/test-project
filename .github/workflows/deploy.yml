name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you publish the current branch by hand from the Actions tab,
  # which is handy for previewing before a merge.
  workflow_dispatch:
    inputs:
      cloudflare_only:
        description: Only make a Cloudflare preview of this branch (leave GitHub Pages as it is)
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling so a finished
# build always makes it out.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The build script runs `tsc -b` before vite, so a type error fails here.
      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: ${{ !inputs.cloudflare_only }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The same build on Cloudflare Pages too. Main is the production site; any
  # other branch run by hand becomes a preview. Needs the repository secrets
  # CLOUDFLARE_API_TOKEN (Pages: Edit) and CLOUDFLARE_ACCOUNT_ID; a failure
  # here never holds up GitHub Pages.
  cloudflare:
    needs: build
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: test-project-games
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: github-pages

      - name: Unpack the build
        run: mkdir dist && tar -xf artifact.tar -C dist

      # The first run creates the Pages project; later runs find it there.
      - name: Make sure the Pages project exists
        run: npx --yes wrangler@3 pages project create "$PROJECT" --production-branch=main || true

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@3 pages deploy dist --project-name="$PROJECT" --branch="${{ github.ref_name }}" --commit-dirty=true
