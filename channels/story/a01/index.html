<!doctype html>
<html><head><meta charset="utf-8"><style>@font-face{font-family:P;font-weight:800;src:url(../../../gunggeum/tools/fonts/Pretendard-ExtraBold.otf)}html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../physics/vendor/three-0.149.0.min.js"></script>
<script src="timeline.js"></script>
<script src="../tools/engine.js"></script>
<script>
// A 「도시들이 사람이라면」 #1 — 서울·부산·인천·울산이 한 집에 사는 시트콤 (30초 샘플)
const S = Story.init({ title: '도시들이 사람이라면', sub: '#1 오늘 저녁 메뉴 회의', end: ['도시들이 사람이라면', '다음 화에 나올 동네를 댓글로!'], bg: '#fbe9d0' });
const { scene } = S, M = Story.mesh;
window.CAST_STYLE = { 서울: { name: '서울', color: '#9fb4ff' }, 부산: { name: '부산', color: '#7fd3ff' }, 인천: { name: '인천', color: '#c7b2ff' }, 울산: { name: '울산', color: '#8ff0d8' } };
// 거실
M(new THREE.BoxGeometry(14, 0.2, 10), '#e7c9a1', [0, -0.1, 0], scene, { line: 0 });
M(new THREE.BoxGeometry(14, 7, 0.2), '#f7e3c6', [0, 3.4, -2.6], scene, { line: 0 });
M(new THREE.BoxGeometry(2.4, 1.6, 0.06), '#9fd3ff', [-3.2, 3.4, -2.48], scene, { line: 1.02 }); // 창문
M(new THREE.BoxGeometry(7.2, 0.5, 1.3), '#d86b4a', [0, 0.45, -1.4], scene); M(new THREE.BoxGeometry(7.2, 1.1, 0.35), '#c95c3c', [0, 1.0, -2.0], scene); // 소파
M(new THREE.CylinderGeometry(0.9, 0.9, 0.12, 32), '#fff6e8', [0, 0.62, 1.4], scene); M(new THREE.CylinderGeometry(0.12, 0.12, 0.6, 12), '#b98a5a', [0, 0.3, 1.4], scene); // 탁자
M(new THREE.BoxGeometry(0.5, 0.04, 0.8), '#222', [0.25, 0.7, 1.35], scene); // 휴대폰(배달 앱)
const C = {
  서울: Story.char({ pos: [-2.25, 0.2, -0.6], cloth: '#4a5a8a', pants: '#2c3350', hair: '#2b2b2b', blinkOff: 0.2, props: (h) => { // N타워 같은 작은 탑 모자
    M(new THREE.CylinderGeometry(0.05, 0.08, 0.6, 12), '#eeeeee', [0, 0.82, 0], h); M(new THREE.CylinderGeometry(0.18, 0.12, 0.14, 16), '#e2493b', [0, 1.08, 0], h); M(new THREE.CylinderGeometry(0.015, 0.015, 0.3, 6), '#ccc', [0, 1.3, 0], h, { line: 0 }); } }),
  부산: Story.char({ pos: [-0.75, 0.2, -0.6], cloth: '#2f80ed', pants: '#1f3b66', hair: '#3a2a1a', blinkOff: 1.1, props: (h) => { // 갈매기
    const b = new THREE.Group(); b.position.set(0.05, 0.66, 0); h.add(b); M(new THREE.SphereGeometry(0.16, 16, 12), '#ffffff', [0, 0, 0], b);
    for (const s of [-1, 1]) { const w = M(new THREE.BoxGeometry(0.34, 0.04, 0.14), '#ffffff', [s * 0.24, 0.04, 0], b); w.rotation.z = s * 0.4; }
    M(new THREE.ConeGeometry(0.05, 0.14, 8), '#ffb020', [0, 0, 0.18], b).rotation.x = Math.PI / 2; } }),
  인천: Story.char({ pos: [0.75, 0.2, -0.6], cloth: '#7b5cff', pants: '#3b2f7a', hair: '#1f1f1f', blinkOff: 2.0, props: (h) => { // 비행기
    const p = new THREE.Group(); p.position.set(0, 0.68, 0); p.rotation.y = 0.5; h.add(p);
    M(new THREE.CapsuleGeometry(0.08, 0.5, 4, 10), '#ffffff', [0, 0, 0], p).rotation.z = Math.PI / 2; M(new THREE.BoxGeometry(0.16, 0.03, 0.7), '#cfd8ff', [0, 0, 0], p); M(new THREE.BoxGeometry(0.1, 0.18, 0.03), '#e2493b', [-0.28, 0.1, 0], p); } }),
  울산: Story.char({ pos: [2.25, 0.2, -0.6], cloth: '#20a39e', pants: '#1c4f4c', hair: '#2b2b2b', blinkOff: 0.7, props: (h) => { // 고래
    const w = M(new THREE.SphereGeometry(0.28, 20, 14), '#3d7dd8', [0, 0.7, 0], h); w.scale.set(1.5, 0.8, 0.9);
    const tail = M(new THREE.ConeGeometry(0.14, 0.3, 4), '#3d7dd8', [-0.45, 0.8, 0], h); tail.rotation.z = 1.2;
    M(new THREE.SphereGeometry(0.04, 8, 6), '#111', [0.25, 0.75, 0.2], h, { line: 0 }); } }),
};
Object.values(C).forEach((c) => scene.add(c.g));
const WIDE = { pos: [0, 2.6, 9.5], look: [0, 1.4, 0], fov: 34 };
window.render = (t) => S.render(t, {
  cast: C,
  update: (t, l) => { for (const [n, c] of Object.entries(C)) c.g.rotation.y = l && l.who !== n ? Math.atan2(C[l.who].g.position.x - c.g.position.x, 6) * 0.5 : 0; },
  shot: (t, l) => {
    if (!l || t < 1.6 || l === S.TL.lines[S.TL.lines.length - 1] && t > l.start + 0.8) return WIDE;
    const x = C[l.who].g.position.x; return { pos: [x * 0.7, 2.2, 5.0], look: [x, 1.75, -0.6], fov: 30 };
  },
});
window.DUR = TL.dur;
window.ready = document.fonts.load("800 40px P").then(() => { window.render(0); return true; });
</script></body></html>
