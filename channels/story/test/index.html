<!doctype html>
<html><head><meta charset="utf-8">
<style>@font-face{font-family:P;font-weight:800;src:url(../../../gunggeum/tools/fonts/Pretendard-ExtraBold.otf)}html,body{margin:0;background:#000}canvas{display:block}#ui{position:absolute;left:0;top:0}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../physics/vendor/three-0.149.0.min.js"></script>
<script>
// 상황극 시험: 코드로 만든 3D 캐릭터(조선 선비 · 현대 청년) 대화 장면. render(t) 한 번 = 한 프레임
const W = 1080, H = 1920;
const cv = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#bfe3ff'); scene.fog = new THREE.Fog('#bfe3ff', 14, 40);
const cam = new THREE.PerspectiveCamera(32, W / H, 0.1, 100);
scene.add(new THREE.HemisphereLight('#ffffff', '#8a6a4a', 0.75));
const sun = new THREE.DirectionalLight('#fff1d6', 1.5); sun.position.set(4, 9, 6); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6 }); scene.add(sun);
const mat = (c, r = 0.7) => new THREE.MeshStandardMaterial({ color: c, roughness: r });
const add = (geo, m, pos, par = scene, shadow = true) => { const o = new THREE.Mesh(geo, m); o.position.set(...pos); o.castShadow = o.receiveShadow = shadow; par.add(o); return o; };

// 땅·장터 배경 (흙 마당, 초가·기와 느낌 집, 장대)
add(new THREE.PlaneGeometry(60, 60).rotateX(-Math.PI / 2), mat('#d9c3a0', 1), [0, 0, 0]);
function house(x, z, roof, wallCol) {
  const g = new THREE.Group(); g.position.set(x, 0, z); scene.add(g);
  add(new THREE.BoxGeometry(3.2, 1.8, 2.2), mat(wallCol), [0, 0.9, 0], g);
  add(new THREE.BoxGeometry(0.5, 1.2, 0.05), mat('#6b4a2e'), [0, 0.6, 1.11], g);
  const r = add(new THREE.ConeGeometry(2.6, 1.3, 4, 1), mat(roof, 0.9), [0, 2.4, 0], g); r.rotation.y = Math.PI / 4; r.scale.set(1.15, 1, 0.85);
  return g;
}
house(-3.5, -4.5, '#c9a35a', '#efe4cf'); house(1.2, -6, '#4b5563', '#f3ece0'); house(5.2, -4.2, '#c9a35a', '#e8dcc4');
// 햄버거 가게 간판 (현대 물건)
const shop = house(-0.6, -2.8, '#e2493b', '#fff7e6');
const sign = document.createElement('canvas'); sign.width = 512; sign.height = 128; const sg = sign.getContext('2d');
sg.fillStyle = '#e2493b'; sg.fillRect(0, 0, 512, 128); sg.fillStyle = '#fff'; sg.font = '800 72px P'; sg.textAlign = 'center'; sg.textBaseline = 'middle'; sg.fillText('햄버거', 256, 68);
add(new THREE.PlaneGeometry(2.2, 0.55), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(sign) }), [0, 1.55, 1.12], shop, false);

// 얼굴 그림 (눈·눈썹·입) — 입 모양을 바꿔 말하는 것처럼
function faceTex(skin) {
  const c = document.createElement('canvas'); c.width = c.height = 256; const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding;
  const draw = (mouth, blink, mood) => {
    const g = c.getContext('2d'); g.fillStyle = skin; g.fillRect(0, 0, 256, 256);
    g.fillStyle = 'rgba(255,120,120,.35)'; g.beginPath(); g.ellipse(70, 160, 22, 14, 0, 0, 7); g.ellipse(186, 160, 22, 14, 0, 0, 7); g.fill();
    g.fillStyle = '#1d1d1d';
    for (const x of [88, 168]) { if (blink) g.fillRect(x - 14, 128, 28, 5); else { g.beginPath(); g.ellipse(x, 128, 11, 15, 0, 0, 7); g.fill(); g.fillStyle = '#fff'; g.beginPath(); g.arc(x + 4, 122, 4, 0, 7); g.fill(); g.fillStyle = '#1d1d1d'; } }
    g.lineWidth = 7; g.lineCap = 'round'; g.strokeStyle = '#2b2b2b';
    const br = mood === 'surprised' ? -10 : 0; g.beginPath(); g.moveTo(70, 100 + br); g.lineTo(104, 96 + br); g.moveTo(152, 96 + br); g.lineTo(186, 100 + br); g.stroke();
    g.fillStyle = '#7a2b2b'; g.beginPath(); g.ellipse(128, 188, 18, 4 + mouth * 16, 0, 0, 7); g.fill();
    tex.needsUpdate = true;
  };
  draw(0, false); return { tex, draw };
}
function character(x, z, opt) {
  const g = new THREE.Group(); g.position.set(x, 0, z); scene.add(g);
  const body = add(new THREE.CylinderGeometry(0.42, 0.62, 1.2, 24), mat(opt.cloth), [0, 0.7, 0], g);
  add(new THREE.CylinderGeometry(0.12, 0.12, 0.25, 12), mat(opt.skin), [0, 1.38, 0], g);
  const face = faceTex(opt.skin);
  const headMats = [mat(opt.skin), mat(opt.skin), mat(opt.skin), mat(opt.skin), new THREE.MeshStandardMaterial({ map: face.tex, roughness: 0.8 }), mat(opt.skin)];
  const head = add(new THREE.BoxGeometry(0.95, 0.9, 0.85, 1, 1, 1), headMats, [0, 1.95, 0], g);
  for (const s of [-1, 1]) { const arm = add(new THREE.CapsuleGeometry(0.12, 0.6, 4, 12), mat(opt.cloth), [s * 0.58, 0.95, 0], g); arm.rotation.z = s * 0.25; }
  opt.hat(head);
  return { g, head, face, body };
}
const seonbi = character(-0.95, 0.4, {
  cloth: '#f4f1e8', skin: '#f2c9a3',
  hat: (h) => { // 갓: 넓은 챙 + 높은 모자
    add(new THREE.CylinderGeometry(0.95, 0.95, 0.04, 40), new THREE.MeshStandardMaterial({ color: '#1c1c1c', roughness: 0.5, transparent: true, opacity: 0.88 }), [0, 0.5, 0], h);
    add(new THREE.CylinderGeometry(0.32, 0.36, 0.5, 30), mat('#1c1c1c', 0.5), [0, 0.74, 0], h);
    const beard = add(new THREE.ConeGeometry(0.12, 0.35, 12), mat('#2a2a2a'), [0, -0.55, 0.38], h); beard.rotation.x = Math.PI;
  },
});
const youth = character(1.0, 0.4, {
  cloth: '#3d7bd9', skin: '#f5cfae',
  hat: (h) => { // 야구 모자
    add(new THREE.SphereGeometry(0.5, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), mat('#e2493b'), [0, 0.38, 0], h);
    const bill = add(new THREE.BoxGeometry(0.6, 0.04, 0.45), mat('#e2493b'), [0, 0.4, 0.55], h);
  },
});
seonbi.g.rotation.y = 0.55; youth.g.rotation.y = -0.55;
// 햄버거 (가운데 쟁반)
const burger = new THREE.Group(); burger.position.set(0.05, 1.05, 0.9); scene.add(burger);
add(new THREE.BoxGeometry(0.9, 0.9, 0.6), mat('#8b5e3c'), [0, -0.55, 0], burger);
for (const [y, h, c, r] of [[0.02, 0.1, '#d89a4a', 0.28], [0.1, 0.07, '#5a3a22', 0.3], [0.16, 0.04, '#58b84a', 0.31], [0.2, 0.04, '#f2c43a', 0.3], [0.29, 0.14, '#e3a24f', 0.28]]) add(new THREE.CylinderGeometry(r, r, h, 28), mat(c), [0, y, 0], burger);

const LINES = [
  { who: seonbi, a: 0.6, b: 3.2, text: '이보게, 이 둥근 떡은 무엇인가?', mood: 'surprised' },
  { who: youth, a: 3.5, b: 6.2, text: '햄버거예요! 한 입 드셔 보세요.' },
  { who: seonbi, a: 6.5, b: 9.0, text: '…이, 이 맛은?! 한 개 더 주게!', mood: 'surprised' },
];
function subtitle(t) {
  const l = LINES.find((q) => t >= q.a && t <= q.b + 0.3); if (!l) return null; return l;
}
const ui = document.createElement('canvas'); ui.width = W; ui.height = H; const ug = ui.getContext('2d');
function render(t) {
  for (const ch of [seonbi, youth]) {
    const line = LINES.find((q) => q.who === ch && t >= q.a && t <= q.b);
    const talk = line ? Math.abs(Math.sin(t * 16)) * (0.5 + 0.5 * Math.abs(Math.sin(t * 5.3))) : 0;
    const blink = (t * 1.7 + (ch === youth ? 0.5 : 0)) % 3 < 0.12;
    ch.face.draw(talk, blink, line && line.mood);
    ch.head.position.y = 1.95 + Math.sin(t * 2 + (ch === youth ? 1 : 0)) * 0.02 + talk * 0.03;
    ch.head.rotation.z = line ? Math.sin(t * 3) * 0.05 : 0;
  }
  const sp = LINES.find((q) => t >= q.a && t <= q.b);
  const focus = sp ? sp.who.g.position.x * 0.35 : 0;
  cam.position.set(focus + 0.3, 2.4, 6.4); cam.lookAt(focus * 0.6, 1.55, 0);
  renderer.render(scene, cam);
  // 자막·제목은 3D 위에 2D로
  const out = cv.getContext ? null : null;
}
window.render = render; window.DUR = 9.5;
window.ready = document.fonts.load('800 40px P').then(() => { render(0); return true; });
window.LINES = LINES;
</script></body></html>
