<title>겨울 소원마을</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
/* 한 화면 3D 마을: 위 알림 칩 · 가운데 3D 마을(눌러서 걷기) · 아래 메뉴. 겨울밤 단일 테마 */
:root{
  --ink:#f6f2ea; --ink-soft:#c3cbe0; --glass:rgba(14,20,40,.62); --glass-line:rgba(255,255,255,.16);
  --accent:#ffd27a; --accent-ink:#2a1a04; --danger:#ff9b8c;
  --font-display:"Jua","Noto Sans KR",system-ui,sans-serif; --font-body:"Noto Sans KR",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;}
[hidden]{display:none!important;}
body{background:#0a1020;color:var(--ink);font-family:var(--font-body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;}
#world{position:fixed;inset:0;}
#world canvas{display:block;width:100%;height:100%;}
.labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;}
.tag{position:absolute;left:0;top:0;background:rgba(20,26,48,.58);color:#fff;font:400 13px var(--font-display);padding:3px 9px;border-radius:999px;white-space:nowrap;}
.tag.me{background:rgba(255,255,255,.9);color:#2a2238;}
.tag.me b{color:#8a7fa8;font-weight:400;margin-right:4px;}
.bubble{position:absolute;left:0;top:0;font-size:28px;line-height:1;}
.chips{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;gap:6px;overflow-x:auto;padding-block:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--glass);border:1px solid var(--glass-line);color:var(--ink);font:400 13px var(--font-body);padding:7px 12px;border-radius:999px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;min-height:34px;}
.chip.hot{border-color:var(--accent);color:var(--accent);}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 60px);transform:translateX(-50%);background:var(--glass);border:1px solid var(--glass-line);padding:9px 16px;border-radius:999px;font-size:14px;max-width:88%;text-align:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.toast button{margin-left:8px;border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:4px 10px;font:400 13px var(--font-display);cursor:pointer;}
.act{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);transform:translateX(-50%);display:flex;gap:8px;width:max-content;max-width:94%;flex-wrap:wrap;justify-content:center;}
.btn{border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:400 16px var(--font-display);padding:11px 18px;min-height:44px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.35);}
.btn.ghost{background:var(--glass);color:var(--ink);border:1px solid var(--glass-line);}
.menu{position:fixed;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:grid;grid-template-columns:repeat(5,1fr);background:var(--glass);border:1px solid var(--glass-line);border-radius:22px;padding:6px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);max-width:520px;margin:0 auto;}
.menu button{border:0;background:transparent;color:var(--ink);font:400 12px var(--font-body);display:grid;justify-items:center;gap:3px;padding:6px 2px;min-height:52px;border-radius:16px;cursor:pointer;}
.menu button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.menu button[aria-pressed="true"]{background:rgba(255,255,255,.14);color:var(--accent);}
.btn:focus-visible,.menu button:focus-visible,.chip:focus-visible,.pick:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:#141b33;border:1px solid var(--glass-line);border-bottom:0;border-radius:22px 22px 0 0;padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:grid;gap:12px;max-height:74%;overflow:auto;z-index:5;}
.sheet h2{margin:0;font:400 21px var(--font-display);}
.sheet p{margin:0;color:var(--ink-soft);font-size:13px;line-height:1.55;}
.picks{display:flex;flex-wrap:wrap;gap:6px;}
.pick{border:1px solid var(--glass-line);background:transparent;color:var(--ink);border-radius:999px;padding:8px 12px;font:400 14px var(--font-body);min-height:38px;min-width:40px;cursor:pointer;}
.pick[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.pick.hat[aria-pressed="true"]{outline:3px solid #fff;outline-offset:2px;}
.pick.emo{font-size:24px;padding:6px 12px;}
.sheet label{font-size:13px;color:var(--ink-soft);}
.sheet input{width:100%;box-sizing:border-box;background:#0a1020;color:var(--ink);border:1px solid var(--glass-line);border-radius:12px;padding:11px 12px;font:400 15px var(--font-body);}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}
.err{color:var(--danger);font-size:13px;min-height:1em;}
.list{display:grid;gap:6px;margin:0;padding:0;list-style:none;}
.list li{background:#0a1020;border:1px solid var(--glass-line);border-radius:12px;padding:9px 11px;font-size:14px;overflow-wrap:anywhere;}
.list li small{display:block;color:var(--ink-soft);font-size:11px;margin-top:2px;}
.vbtn{display:grid;gap:2px;text-align:left;border-radius:16px;}
.vbtn small{font:400 12px var(--font-body);opacity:.8;}
.hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translateX(-50%);color:var(--ink-soft);font-size:13px;background:var(--glass);padding:6px 12px;border-radius:999px;white-space:nowrap;}
.fail{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--ink-soft);}
</style>

<div id="world" aria-label="3D 겨울 마을. 화면을 누르면 그곳으로 걸어가요"></div>
<div class="labels" id="labels"></div>
<div class="chips" id="chips"></div>
<div class="toast" id="toast" hidden></div>
<div class="hint" id="hint">눌러서 걸어가 보세요</div>
<div class="act" id="act"></div>
<nav class="menu" id="menu" aria-label="행동">
  <button id="m-emote"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5c1 1.3 2.2 2 3.5 2s2.5-.7 3.5-2"/><path d="M9 9.5h.01M15 9.5h.01"/></svg>표정</button>
  <button id="m-ball"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7"/><path d="M8 11c1-1 3-1.5 4-1M14 15.5c1 0 2-.5 2.5-1.5"/><path d="M17 4l2-2M19 7h3"/></svg>눈덩이</button>
  <button id="m-sit" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M20 15.5A8 8 0 1 1 9 4a6.5 6.5 0 0 0 11 11.5z"/></svg><span id="m-sit-label">눈멍하기</span></button>
  <button id="m-wish"><svg viewBox="0 0 24 24"><path d="M12 3l2.4 5 5.6.6-4.2 3.8 1.2 5.6L12 15.2 7 18l1.2-5.6L4 8.6 9.6 8z"/></svg>소원</button>
  <button id="m-photo"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>사진</button>
</nav>
<div class="sheet" id="sheet" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(() => {
if (!window.THREE) { document.body.insertAdjacentHTML("beforeend", '<div class="fail">3D 화면을 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.</div>'); return; }
const $ = (id) => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const kstNow = () => new Date(Date.now() + 9 * 3600e3);
const kstDay = () => kstNow().toISOString().slice(0, 10);
const rnd = (seed) => () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
const hashStr = (s) => { let h = 2166136261; for (const c of String(s)) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; };

// ---------- 마을 설정 ----------
const HATS = ["#e2483d", "#3d6fe2", "#2fa36b", "#9a5ae2", "#f0a33a", "#e26aa8", "#3fb6c9"];
const NICKS = ["눈송이", "호빵", "귤", "솜사탕", "별빛", "방울", "털장갑", "코코아", "붕어빵", "군고구마", "포근이", "눈꽃", "말랑", "꼬마전구"];
const V = {
  santa: {
    name: "산타마을", sit: "눈멍하기", sitMsg: "눈 내리는 걸 멍하니 보는 중",
    presets: ["가족 모두 건강하게", "올해도 수고했어", "합격하게 해 주세요", "내년엔 연애하게", "행복한 크리스마스", "다 잘될 거야"],
    spots: [{ id: "tree", x: 0, z: -7, r: 4.2, acts: [["소원 장식 달기", "wish"], ["달린 소원 보기", "list"]] },
            { id: "mail", x: 5.5, z: -3, r: 2, acts: [["산타에게 편지", "letter"]] }],
    giftName: "선물",
  },
  sun: {
    name: "해맞이마을", sit: "바다멍", sitMsg: "파도 소리 들으며 쉬는 중",
    presets: ["새해 복 많이 받으세요", "올해는 꼭 이루자", "건강이 최고", "돈 많이 벌게 해 주세요", "가족 모두 행복하게", "작년보다 나은 한 해"],
    spots: [{ id: "deck", x: 0, z: -9, r: 3, acts: [["해넘이 보기", "sunset"], ["해돋이 보기", "sunrise"]] },
            { id: "lantern", x: -7, z: -2, r: 2.8, acts: [["소원 풍등 날리기", "wish"], ["날린 소원 보기", "list"]] },
            { id: "bell", x: 7, z: -3, r: 2.8, acts: [["종 치기", "bell"]] }],
    giftName: "복주머니",
  },
};
let vk = store.get("village", "santa"); if (!V[vk]) vk = "santa";

// ---------- 3D 기본 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.75));
renderer.outputEncoding = THREE.sRGBEncoding;
$("world").append(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 400);
const hemi = new THREE.HemisphereLight(0x9fb4ff, 0x40406a, 0.75); scene.add(hemi);
const sunLight = new THREE.DirectionalLight(0xffffff, 0.5); sunLight.position.set(-10, 20, 10); scene.add(sunLight);
let world = new THREE.Group(); scene.add(world);
const M = (color, extra = {}) => new THREE.MeshLambertMaterial({ color, ...extra });
const glowM = (color) => new THREE.MeshBasicMaterial({ color });
function add(geo, mat, x = 0, y = 0, z = 0, parent = world) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); parent.add(m); return m; }
const shadowGeo = new THREE.CircleGeometry(0.7, 20), shadowMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.22, depthWrite: false });

// ---------- 캐릭터: 눈사람(산타마을) · 털모자 동글이(해맞이마을) ----------
function makeAvatar(kind, hat) {
  const g = new THREE.Group(), white = M(0xf7f9ff), hatM = M(hat);
  const sh = new THREE.Mesh(shadowGeo, shadowMat); sh.rotation.x = -Math.PI / 2; sh.position.y = 0.02; g.add(sh);
  const body = new THREE.Group(); g.add(body);
  if (kind === "santa") {
    add(new THREE.SphereGeometry(0.62, 20, 16), white, 0, 0.6, 0, body);
    add(new THREE.SphereGeometry(0.44, 20, 16), white, 0, 1.42, 0, body);
    add(new THREE.TorusGeometry(0.34, 0.09, 8, 20), hatM, 0, 1.12, 0, body).rotation.x = Math.PI / 2;
    add(new THREE.CylinderGeometry(0.3, 0.38, 0.32, 16), hatM, 0, 1.82, 0, body);
    add(new THREE.SphereGeometry(0.09, 10, 8), white, 0, 2.03, 0, body);
    const nose = add(new THREE.ConeGeometry(0.06, 0.32, 10), M(0xff8a2a), 0, 1.42, 0.5, body); nose.rotation.x = Math.PI / 2;
    for (const s of [-1, 1]) { add(new THREE.SphereGeometry(0.045, 8, 6), M(0x222233), s * 0.15, 1.53, 0.4, body); const arm = add(new THREE.CylinderGeometry(0.025, 0.03, 0.7, 6), M(0x5a3d2b), s * 0.72, 0.95, 0, body); arm.rotation.z = s * 1.1; }
  } else {
    const bodyM = M(new THREE.Color(hat).lerp(new THREE.Color(0xffffff), 0.55));
    add(new THREE.SphereGeometry(0.72, 22, 18), bodyM, 0, 0.78, 0, body).scale.set(1, 1.06, 1);
    add(new THREE.SphereGeometry(0.5, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2), hatM, 0, 1.2, 0, body);
    add(new THREE.SphereGeometry(0.13, 10, 8), M(0xffffff), 0, 1.72, 0, body);
    add(new THREE.TorusGeometry(0.48, 0.08, 8, 22), M(0xffffff), 0, 1.2, 0, body).rotation.x = Math.PI / 2;
    for (const s of [-1, 1]) { add(new THREE.SphereGeometry(0.055, 8, 6), M(0x2a2233), s * 0.2, 0.95, 0.66, body); add(new THREE.SphereGeometry(0.09, 10, 8), M(0xff9aa8), s * 0.36, 0.82, 0.58, body).scale.set(1, 0.6, 0.5); }
  }
  g.userData.body = body;
  return g;
}

// ---------- 산타마을 ----------
const dyn = {};
function resetDyn() { Object.assign(dyn, { bulbs: [], ornaments: null, lanterns: null, sun: null, sea: null, bell: null, gifts: [], snow: null, fire: [], stars: null, fireLight: null, star: null }); }
function pines(count, rMin, rMax, seed, snowy) {
  const r = rnd(seed), cone = new THREE.ConeGeometry(1, 2.4, 7), trunk = new THREE.CylinderGeometry(0.18, 0.22, 0.6, 6);
  const leaves = new THREE.InstancedMesh(cone, M(snowy ? 0x2d5e4a : 0x2f6b3f), count * 2), top = new THREE.InstancedMesh(cone, M(snowy ? 0xe8eef8 : 0x3b7d4a), count), tr = new THREE.InstancedMesh(trunk, M(0x5a3d2b), count);
  const o = new THREE.Object3D();
  for (let i = 0; i < count; i++) {
    const a = r() * Math.PI * 2, d = rMin + r() * (rMax - rMin), s = 0.8 + r() * 1.3, x = Math.cos(a) * d, z = !snowy && Math.sin(a) < 0 ? Math.abs(Math.sin(a)) * d * 0.6 + 2 : Math.sin(a) * d - 6;
    o.rotation.set(0, r() * 6, 0);
    o.position.set(x, 0.3 * s, z); o.scale.set(s, s, s); o.updateMatrix(); tr.setMatrixAt(i, o.matrix);
    o.position.y = 1.5 * s; o.updateMatrix(); leaves.setMatrixAt(i * 2, o.matrix);
    o.position.y = 2.5 * s; o.scale.set(s * 0.72, s * 0.8, s * 0.72); o.updateMatrix(); leaves.setMatrixAt(i * 2 + 1, o.matrix);
    o.position.y = 3.35 * s; o.scale.set(s * 0.42, s * 0.45, s * 0.42); o.updateMatrix(); top.setMatrixAt(i, o.matrix);
  }
  world.add(leaves, top, tr);
}
function cabin(x, z, rot) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = rot; world.add(g);
  add(new THREE.BoxGeometry(5, 3, 4), M(0x4a3426), 0, 1.5, 0, g);
  const roof = add(new THREE.ConeGeometry(3.9, 2.2, 4), M(0xf2f6ff), 0, 4.1, 0, g); roof.rotation.y = Math.PI / 4; roof.scale.set(1, 1, 0.82);
  for (const wx of [-1.4, 1.4]) add(new THREE.PlaneGeometry(0.9, 0.9), glowM(0xffc56a), wx, 1.7, 2.01, g);
  add(new THREE.PlaneGeometry(0.9, 1.7), M(0x2a1a10), 0, 0.85, 2.01, g);
  add(new THREE.PlaneGeometry(0.7, 0.7), glowM(0xffd88a), 0, 3.9, 1.62, g);
  const pl = new THREE.PointLight(0xffb45a, 0.9, 9, 2); pl.position.set(0, 1.6, 3); g.add(pl);
}
function lamp(x, z) {
  add(new THREE.CylinderGeometry(0.07, 0.09, 2.6, 8), M(0x22252e), x, 1.3, z);
  add(new THREE.BoxGeometry(0.42, 0.5, 0.42), glowM(0xffe2a0), x, 2.75, z);
  add(new THREE.ConeGeometry(0.34, 0.3, 4), M(0x22252e), x, 3.15, z).rotation.y = Math.PI / 4;
}
function stars(color) {
  const N = 300, p = new Float32Array(N * 3), r = rnd(5);
  for (let i = 0; i < N; i++) { const a = r() * Math.PI * 2, e = 0.15 + r() * 1.2; p[i * 3] = Math.cos(a) * 150 * Math.cos(e); p[i * 3 + 1] = 150 * Math.sin(e); p[i * 3 + 2] = Math.sin(a) * 150 * Math.cos(e); }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(p, 3));
  dyn.stars = new THREE.Points(g, new THREE.PointsMaterial({ color, size: 0.9, fog: false, transparent: true })); world.add(dyn.stars);
}
// 마을 장식 인형 (이름표 없음 — 방문자가 아님)
function decor(kind, list) { list.forEach(([x, z, r], i) => { const a = makeAvatar(kind, HATS[(i * 3 + 1) % HATS.length]); a.position.set(x, 0, z); a.rotation.y = r; a.scale.setScalar(0.92); world.add(a); }); }
function fireAt(x, z) {
  for (let i = 0; i < 6; i++) { const l = add(new THREE.CylinderGeometry(0.08, 0.1, 1.2, 6), M(0x5a3d2b), x, 0.15, z); l.rotation.z = Math.PI / 2; l.rotation.y = i / 6 * Math.PI; }
  for (let i = 0; i < 3; i++) { const f = add(new THREE.ConeGeometry(0.32 - i * 0.07, 0.9 - i * 0.15, 8), glowM([0xff6a2a, 0xffa43e, 0xffe27a][i]), x, 0.55, z); f.userData.ph = i; dyn.fire.push(f); }
  const pl = new THREE.PointLight(0xff9a40, 1.3, 10, 2); pl.position.set(x, 1, z); world.add(pl); dyn.fireLight = pl;
}
function buildSanta() {
  scene.background = new THREE.Color(0x101a3a); scene.fog = new THREE.Fog(0x1a2448, 22, 70);
  hemi.color.set(0x9fb4ff); hemi.groundColor.set(0x505078); hemi.intensity = 0.8; sunLight.intensity = 0.35; sunLight.color.set(0xb8c8ff); sunLight.position.set(-10, 20, 10);
  add(new THREE.CircleGeometry(80, 48), M(0xe6ecf8)).rotation.x = -Math.PI / 2;
  add(new THREE.RingGeometry(3.8, 6.4, 40), M(0xd4dcec), 0, 0.01, -7).rotation.x = -Math.PI / 2;
  [[-30, -45, 16, 22], [5, -55, 22, 30], [34, -46, 15, 20]].forEach(([x, z, r, h]) => { add(new THREE.ConeGeometry(r, h, 6), M(0x2c3558), x, h / 2, z); add(new THREE.ConeGeometry(r * 0.38, h * 0.38, 6), M(0xf0f4ff), x, h * 0.81, z); });
  pines(110, 18, 40, 7, true);
  cabin(-10, -15, 0.25); cabin(0, -18, 0); cabin(10, -15, -0.25);
  [[-6, -1], [6, -1], [-6.5, -11], [6.5, -11], [-3, 3], [3, 3]].forEach(([x, z]) => lamp(x, z));
  // 소원 트리
  const tz = -7;
  add(new THREE.CylinderGeometry(0.35, 0.45, 1.2, 10), M(0x5a3d2b), 0, 0.6, tz);
  [[2.6, 2.6, 1.9], [2.1, 2.3, 3.3], [1.55, 2, 4.55], [1.0, 1.6, 5.6]].forEach(([r, h, y]) => add(new THREE.ConeGeometry(r, h, 14), M(0x1f5a3c), 0, y, tz));
  dyn.star = add(new THREE.OctahedronGeometry(0.42), glowM(0xffd65a), 0, 6.75, tz);
  const cols = [0xff5a5a, 0xffd65a, 0x6ad1ff, 0xff9bd2, 0xb6ff6a, 0xffffff], bulbGeo = new THREE.SphereGeometry(0.09, 8, 6), r = rnd(3);

    ["😊", "😆", "🥰", "🥶", "😴", "👋", "🎉", "🙏"].forEach((e) => { const b = h("button", { className: "pick emo", textContent: e }); b.addEventListener("click", () => { me.emo = e; me.emoAt = Date.now(); sendPresence(true); closeSheet(); sfx.pop(); }); row.append(b); });
    el.append(row, h("div", { className: "row" }, [h("button", { className: "btn ghost", textContent: "이름·모자 바꾸기", onclick: () => openNick(false) }), h("button", { className: "btn ghost", textContent: "닫기", onclick: closeSheet })]));
  });
}
function openWish() {
  const isSanta = vk === "santa"; let pick = V[vk].presets[0];
  sheet((el) => {
    el.append(h("h2", { textContent: isSanta ? "소원 트리에 장식 달기" : "소원 풍등 날리기" }), h("p", { textContent: isSanta ? "고른 소원이 트리의 반짝이는 장식이 돼요. 마을에 온 사람 모두에게 보여요." : "풍등이 바다 위 하늘로 올라가요. 마을에 온 사람 모두에게 보여요." }));
    const picks = h("div", { className: "picks" });
    V[vk].presets.forEach((p) => { const b = h("button", { className: "pick", textContent: p }); b.setAttribute("aria-pressed", String(p === pick)); b.addEventListener("click", () => { pick = p; picks.querySelectorAll(".pick").forEach((x) => x.setAttribute("aria-pressed", String(x.textContent === p))); }); picks.append(b); });
    const inp = h("input", { id: "wish-extra", maxLength: 20, placeholder: "한마디 더 (20자, 선택)" }), err = h("p", { className: "err" });
    el.append(picks, h("label", { htmlFor: "wish-extra", textContent: "한마디 더 붙이기" }), inp, err);
    const ok = h("button", { className: "btn", textContent: isSanta ? "장식 달기" : "풍등 날리기" });
    ok.addEventListener("click", async () => { const c = clean(inp.value); if (!c.ok) { err.textContent = c.why; return; } ok.disabled = true; await saveWish({ preset: pick, text: c.text, at: new Date().toISOString() }); closeSheet(); isSanta ? sfx.chime() : sfx.whoosh(); toast(isSanta ? "트리에 장식이 하나 늘었어요" : "풍등이 하늘로 올라가요"); });
    el.append(h("div", { className: "row" }, [h("button", { className: "btn ghost", textContent: "닫기", onclick: closeSheet }), ok]));
  });
}
function openList() {
  const list = wishes[vk];
  sheet((el) => {
    el.append(h("h2", { textContent: vk === "santa" ? `트리에 달린 소원 ${list.length}개` : `하늘의 풍등 ${list.length}개` }));
    if (!list.length) el.append(h("p", { textContent: "아직 아무도 없어요. 첫 소원을 남겨 보세요." }));
    const ul = h("ul", { className: "list" });
    list.slice(0, 50).forEach((w) => ul.append(h("li", {}, [document.createTextNode(w.preset + (w.text ? ` · ${w.text}` : "")), h("small", { textContent: new Date(w.at).toLocaleDateString("ko-KR", { month: "long", day: "numeric" }) })])));
    el.append(ul, h("div", { className: "row" }, [h("button", { className: "btn", textContent: "닫기", onclick: closeSheet })]));
  });
}
function openLetter() {
  sheet((el) => {
    el.append(h("h2", { textContent: "산타에게 편지 쓰기" }), h("p", { textContent: "편지는 나만 볼 수 있게 보관돼요. 다른 방문자에게는 보이지 않아요." }));
    const inp = h("input", { id: "letter-text", maxLength: 60, placeholder: "산타 할아버지, 올해 저는…" }), err = h("p", { className: "err" });
    el.append(h("label", { htmlFor: "letter-text", textContent: "편지 (60자)" }), inp, err);
    const ok = h("button", { className: "btn", textContent: "우체통에 넣기" });
    ok.addEventListener("click", async () => { const text = inp.value.trim().slice(0, 60); if (!text) { err.textContent = "한 줄이라도 써 주세요."; return; } try { if (db && uid) await db.collection("data/users/" + uid).doc("santa-letter").set({ text, at: new Date().toISOString() }); else store.set("santa-letter", text); } catch {} closeSheet(); sfx.chime(); toast("편지가 산타에게 날아갔어요"); });
    el.append(h("div", { className: "row" }, [h("button", { className: "btn ghost", textContent: "닫기", onclick: closeSheet }), ok]));
  });
}
function openVillage() {
  sheet((el) => {
    el.append(h("h2", { textContent: "어느 마을로 갈까요?" }));
    [["santa", "산타마을", "눈 내리는 밤, 소원 트리와 통나무집"], ["sun", "해맞이마을", "바닷가 전망대, 풍등과 제야의 종"]].forEach(([k, n, d]) => {
      const b = h("button", { className: "btn vbtn" + (k === vk ? "" : " ghost") }, [document.createTextNode(n), h("small", { textContent: d })]);
      b.addEventListener("click", () => { closeSheet(); if (k !== vk) { vk = k; build(); sendPresence(true); } }); el.append(b);
    });
    el.append(h("div", { className: "row" }, [h("button", { className: "btn ghost", textContent: "닫기", onclick: closeSheet })]));
  });
}
async function saveWish(w) {
  if (db && uid) { try { await db.collection(vk).doc(uid).set(w); return; } catch { toast("저장하지 못했어요. 이 기기에서만 보여요."); } }
  const local = { ...w, id: "local-" + Date.now() }; wishes[vk] = [local, ...wishes[vk].filter((x) => !String(x.id).startsWith("local-"))]; store.set("wish-" + vk, local); renderOrnaments();
}
let downloads = null;
function takePhoto() {
  audio(); sfx.pop(); renderer.render(scene, camera);
  renderer.domElement.toBlob(async (blob) => {
    if (!blob) return;
    try { if (downloads) { await downloads.save({ filename: `${V[vk].name}-${kstDay()}.png`, data: blob }); toast("사진을 저장했어요"); } else toast("여기서는 사진 저장이 안 돼요. 화면 캡처를 써 주세요."); } catch { toast("사진 저장을 취소했어요"); }
  }, "image/png");
}

// ---------- 걷기 ----------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0); let down = null;
renderer.domElement.addEventListener("pointerdown", (e) => { down = { x: e.clientX, y: e.clientY }; audio(); });
renderer.domElement.addEventListener("pointerup", (e) => {
  if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 12 || !$("sheet").hidden) return;
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); ray.setFromCamera(ndc, camera);
  const p = new THREE.Vector3(); if (!ray.ray.intersectPlane(groundPlane, p)) return;
  if (me.sit) setSit(false); if (camMode === "sea") camMode = "follow";
  me.tx = Math.max(-22, Math.min(22, p.x)); me.tz = Math.max(vk === "sun" ? -11 : -16, Math.min(16, p.z)); hintDone = true; $("hint").hidden = true;
});
const keys = new Set(); addEventListener("keydown", (e) => { if (e.target.tagName === "INPUT") return; keys.add(e.key); }); addEventListener("keyup", (e) => keys.delete(e.key));

// ---------- 같이 있기 (실시간) ----------
let db = null, room = null, uid = null, lastSent = 0;
function sendPresence(force) {
  if (!room || !me.nick) return; const n = performance.now(); if (!force && n - lastSent < 120) return; lastSent = n;
  room.presence({ v: vk, x: +me.x.toFixed(2), z: +me.z.toFixed(2), r: +me.rot.toFixed(2), n: me.nick, h: me.hat, s: me.sit, e: me.emo, et: me.emoAt }).catch(() => {});
}
const EMOS = ["😊", "😆", "🥰", "🥶", "😴", "👋", "🎉", "🙏"];
function validP(p) { return p && (p.v === "santa" || p.v === "sun") && Number.isFinite(p.x) && Number.isFinite(p.z) && typeof p.n === "string"; }
function syncPeers(list) {
  const seen = new Set();
  for (const pe of list) {
    if (pe.isMe || pe.kind !== "viewer" || !validP(pe.presence)) continue; seen.add(pe.peer);
    const p = pe.presence, o = others.get(pe.peer) || { obj: null }; others.set(pe.peer, o);
    o.data = { v: p.v, x: Math.max(-30, Math.min(30, p.x)), z: Math.max(-30, Math.min(30, p.z)), r: Number(p.r) || 0, h: (p.h | 0) % HATS.length, s: !!p.s, n: clean(p.n, 8).ok ? clean(p.n, 8).text || "방문자" : "방문자", e: EMOS.includes(p.e) ? p.e : "", et: Number(p.et) || 0 };
  }
  for (const [k, o] of others) if (!seen.has(k)) { if (o.obj) world.remove(o.obj); labels.querySelector(`[data-k="p${k}"]`)?.remove(); labels.querySelector(`[data-k="e${k}"]`)?.remove(); others.delete(k); }
}

// ---------- 그리기 루프 ----------
const camPos = new THREE.Vector3(0, 8, 18), look = new THREE.Vector3(0, 1, 4);
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 0.75 ? 58 : 46; camera.updateProjectionMatrix(); }
addEventListener("resize", resize);
function loop() {
  const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime;
  if (keys.size && !me.sit) { const k = (a) => keys.has(a) ? 1 : 0; const kx = (k("ArrowRight") || k("d")) - (k("ArrowLeft") || k("a")), kz = (k("ArrowDown") || k("s")) - (k("ArrowUp") || k("w")); if (kx || kz) { me.tx = me.x + kx * 1.5; me.tz = me.z + kz * 1.5; } }
  const dx = me.tx - me.x, dz = me.tz - me.z, d = Math.hypot(dx, dz), walking = d > 0.05 && !me.sit;
  if (walking) { const s = Math.min(d, 3.4 * dt); me.x += dx / d * s; me.z += dz / d * s; me.rot = Math.atan2(dx, dz); sendPresence(); }
  if (meObj) {
    meObj.position.set(me.x, 0, me.z);
    let dr = me.rot - meObj.rotation.y; dr = Math.atan2(Math.sin(dr), Math.cos(dr)); meObj.rotation.y += dr * 0.2;
    const b = meObj.userData.body; b.position.y = walking ? Math.abs(Math.sin(t * 10)) * 0.12 : me.sit ? -0.2 : Math.sin(t * 2) * 0.02; b.rotation.z = walking ? Math.sin(t * 10) * 0.08 : 0;
  }
  others.forEach((o, k) => {
    const p = o.data; if (!p) return;
    if (p.v !== vk) { if (o.obj) { world.remove(o.obj); o.obj = null; } return; }
    if (!o.obj || o.obj.userData.hat !== p.h) { if (o.obj) world.remove(o.obj); o.obj = makeAvatar(vk, HATS[p.h]); o.obj.userData.hat = p.h; o.obj.position.set(p.x, 0, p.z); world.add(o.obj); }
    const ox = o.obj.position.x, oz = o.obj.position.z; o.obj.position.x += (p.x - ox) * 0.15; o.obj.position.z += (p.z - oz) * 0.15; o.obj.rotation.y = p.r;
    o.obj.userData.body.position.y = Math.hypot(p.x - ox, p.z - oz) > 0.03 ? Math.abs(Math.sin(t * 10 + k.length)) * 0.12 : p.s ? -0.2 : 0;
  });
  near = null; for (const sp of V[vk].spots) { const dd = Math.hypot(sp.x - me.x, sp.z - me.z); if (dd < sp.r && (!near || dd < near.d)) near = { ...sp, d: dd }; } renderAct();
  for (let i = dyn.gifts.length - 1; i >= 0; i--) {
    const gft = dyn.gifts[i]; gft.rotation.y += dt * 1.2; gft.position.y = 0.15 + Math.sin(t * 3 + i) * 0.12;
    if (Math.hypot(gft.position.x - me.x, gft.position.z - me.z) < 1.1) { world.remove(gft); dyn.gifts.splice(i, 1); const got = store.get(giftKey(), []); got.push(gft.userData.i); store.set(giftKey(), got); sfx.chime(); toast(`오늘의 ${V[vk].giftName}를 찾았어요! ${got.length}/5`); renderChips(); }
  }
  if (vk === "santa") {
    const hh = kstNow().getUTCHours(), lit = hh >= 20 || hh < 2 ? 1 : 0.6;
    dyn.bulbs.forEach((b) => { const k = (0.55 + 0.45 * Math.sin(t * 2.4 + b.userData.ph)) * lit; b.material.color.copy(b.userData.base).multiplyScalar(0.35 + k); });
    if (dyn.star) { dyn.star.rotation.y += dt; dyn.star.scale.setScalar(1 + Math.sin(t * 3) * 0.08); }
    if (dyn.snow) { const a = dyn.snow.geometry.attributes.position; for (let i = 0; i < a.count; i++) { let y = a.getY(i) - dt * (me.sit ? 1.6 : 1.1); if (y < 0) y += 22; a.setY(i, y); } a.needsUpdate = true; }
  } else {
    updateSun(t);
    bellSwing = Math.max(0, bellSwing - dt * 0.4); if (dyn.bell) dyn.bell.rotation.x = Math.sin(t * 6) * bellSwing * 0.35;
    if (dyn.lanterns) dyn.lanterns.children.forEach((m, i) => { const hs = m.userData.h, sp = 0.35 + (hs % 10) / 30, cyc = (t * sp + (hs % 100) / 10) % 14; m.position.set(-7 + ((hs >> 4) % 24 - 12) * 0.25 + Math.sin(t * 0.6 + i) * 0.6 + cyc * (((hs >> 9) % 7) - 3) * 0.35, 1.8 + cyc * 1.7, -2 - cyc * 4.2); m.material.color.setHSL(0.08, 1, 0.55 + Math.sin(t * 3 + i) * 0.08); });
  }
  dyn.fire.forEach((f) => { f.scale.y = 0.85 + Math.sin(t * 12 + f.userData.ph * 2) * 0.18; f.rotation.y += dt * 2; });
  updateBalls(t);
  // 카메라: 뒤에서 내려다보기 · 멍때리기 · 바다 보기
  let want, lookAt;
  if (camMode === "relax") { want = new THREE.Vector3(me.x + Math.sin(t * 0.15) * 1.2, 1.8, me.z + 4); lookAt = new THREE.Vector3(me.x, vk === "santa" ? 7 : 3, me.z - 14); }
  else if (camMode === "sea") { want = new THREE.Vector3(me.x, 5, me.z + 9); lookAt = new THREE.Vector3(0, 3, -70); }
  else { want = new THREE.Vector3(me.x, 7.5, me.z + 11); lookAt = new THREE.Vector3(me.x, 1.2, me.z - 2); }
  camPos.lerp(want, 0.06); look.lerp(lookAt, 0.08); camera.position.copy(camPos); camera.lookAt(look);
  renderer.render(scene, camera);
  if (meObj) { placeTag(tagFor("me", `<b>나</b>${esc(me.nick || "")}`, "tag me"), meObj, 2.5); placeTag(tagFor("emo-me", me.emo && Date.now() - me.emoAt < 4000 ? me.emo : "", "bubble"), meObj, 3.3); }
  others.forEach((o, k) => { if (!o.obj) return; placeTag(tagFor("p" + k, esc(o.data.n), "tag"), o.obj, 2.5); placeTag(tagFor("e" + k, o.data.e && Date.now() - o.data.et < 4000 ? o.data.e : "", "bubble"), o.obj, 3.3); });
  requestAnimationFrame(loop);
}

// 로그인 안 된 미리보기에서도 내 소원은 이 기기에 보이게
for (const k of ["santa", "sun"]) { const l = store.get("wish-" + k, null); if (l) wishes[k] = [l]; }
resetDyn(); resize(); build(); requestAnimationFrame(loop);
if (!me.nick) setTimeout(() => openNick(true), 400);

(async () => {
  if (!window.claude?.use) return;
  try {
    const [dbNs, roomNs, userNs, dlNs] = await Promise.all([claude.use("db"), claude.use("room"), claude.use("user"), claude.use("downloads")]);
    db = dbNs; room = roomNs; downloads = dlNs; uid = userNs ? await userNs.id() : null;
    if (db) for (const k of ["santa", "sun"]) db.collection(k).orderBy("at", "desc").limit(200).onSnapshot((snap) => {
      wishes[k] = snap.docs.map((d) => ({ id: d.id, ...(d.data() || {}) })).filter((w) => V[k].presets.includes(w.preset) && typeof w.at === "string").map((w) => ({ ...w, text: clean(w.text).ok ? clean(w.text).text : "" }));
      if (k === vk) renderOrnaments();
    }, () => {});
    if (room) {
      room.onPeers((ch) => syncPeers(ch.peers));
      room.on("bell", (m) => { if (!m.sameTab && vk === "sun") ringBell(false); });
      room.on("ball", (m) => { const d = m.data || {}; if (m.sameTab || d.v !== vk || ![d.fx, d.fz, d.tx, d.tz].every(Number.isFinite)) return; launch(d.fx, d.fz, d.tx, d.tz, clean(d.n, 8).text || "누군가", false); });
      sendPresence(true);
    }
  } catch {}
})();
})();
</script>
