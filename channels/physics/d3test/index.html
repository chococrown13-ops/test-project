<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../vendor/three-0.149.0.min.js"></script>
<script src="../vendor/cannon-es-0.20.0.global.js"></script>
<script>
// 3D 시험: 나무 지그재그 레일 + 유리구슬 4개 + 도미노 (three.js 그림 + cannon-es 물리). render(t) 한 번 = 한 프레임
const W = 1080, H = 1920, FPS = 24, SUB = 5;
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#1b2140'); scene.fog = new THREE.Fog('#1b2140', 18, 40);
const cam = new THREE.PerspectiveCamera(38, W / H, 0.1, 100);
scene.add(new THREE.HemisphereLight('#cfe0ff', '#3a2a20', 0.7));
const sun = new THREE.DirectionalLight('#fff3dc', 1.6); sun.position.set(6, 14, 8); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 12, bottom: -14, near: 1, far: 40 }); scene.add(sun);

const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
world.allowSleep = false;
const matTrack = new CANNON.Material('track'), matBall = new CANNON.Material('ball');
world.addContactMaterial(new CANNON.ContactMaterial(matTrack, matBall, { friction: 0.04, restitution: 0.25 }));
world.addContactMaterial(new CANNON.ContactMaterial(matBall, matBall, { friction: 0.02, restitution: 0.5 }));
const wood = (c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.55, metalness: 0.05 });
function box(w, h, d, pos, rotZ, col, mat = matTrack, mass = 0) {
  const b = new CANNON.Body({ mass, material: mat, shape: new CANNON.Box(new CANNON.Vec3(w / 2, h / 2, d / 2)) });
  b.position.set(...pos); b.quaternion.setFromEuler(0, 0, rotZ); world.addBody(b);
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wood(col)); m.castShadow = m.receiveShadow = true; scene.add(m);
  m.position.set(b.position.x, b.position.y, b.position.z); m.quaternion.set(b.quaternion.x, b.quaternion.y, b.quaternion.z, b.quaternion.w);
  return { b, m };
}
const dyn = [];
// 지그재그 레일 5개 (바닥 + 양쪽 난간 + 끝 벽)
const COLS = ['#e0a96d', '#d9925a', '#e8b77e', '#cf8a52', '#e0a96d'];
for (let i = 0; i < 5; i++) {
  const d = i % 2 ? -1 : 1, y = 10 - i * 2.3, a = -0.17 * d, c = -d * 0.45; // 레일을 조금씩 엇갈려 떨어지는 자리 밑에 다음 레일
  box(8, 0.2, 1.3, [c, y, 0], a, COLS[i]);
  for (const z of [-0.7, 0.7]) box(8, 0.45, 0.12, [c, y + 0.2, z], a, '#b9773f');
  if (i === 0) box(0.2, 1.6, 1.5, [-d * 4.3 + c, y + 1.4, 0], 0, '#b9773f'); // 출발 쪽 벽
  box(0.2, 2.4, 1.5, [d * 4.3, y - 0.5, 0], 0, '#9c6233'); // 아래쪽 끝 벽(튕겨서 다음 레일로)
}
// 바닥 + 도미노
box(14, 0.3, 6, [0, -2.2, 0], 0, '#3a4470');
for (let k = 0; k < 9; k++) {
  const d = box(0.16, 1.0, 0.6, [-2.6 + k * 0.55, -1.55, 0], 0, ['#ff5d5d', '#ffd23d', '#3fd17a', '#4d8dff'][k % 4], matTrack, 0.4);
  dyn.push(d);
}
// 구슬
const BALL = [['#ff4d4d', 'red'], ['#3d8bff', 'blue'], ['#2fcf6f', 'green'], ['#ffc93d', 'yellow']];
const balls = BALL.map(([c], k) => {
  const b = new CANNON.Body({ mass: 1, material: matBall, shape: new CANNON.Sphere(0.27), linearDamping: 0.01, angularDamping: 0.01 });
  b.position.set(-3.4 + k * 0.62, 11.2 + (k % 2) * 0.3, (k % 2 ? 0.25 : -0.25)); world.addBody(b);
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.27, 48, 32), new THREE.MeshPhysicalMaterial({ color: c, roughness: 0.08, metalness: 0.1, clearcoat: 1, clearcoatRoughness: 0.05 }));
  m.castShadow = true; scene.add(m); return { b, m };
});
// 미리 끝까지 계산해서 프레임마다 위치 저장 (같은 결과)
const N = FPS * 14, REC = [];
for (let f = 0; f < N; f++) {
  for (let s = 0; s < SUB; s++) world.step(1 / (FPS * SUB));
  REC.push([...balls, ...dyn].map(({ b }) => [b.position.x, b.position.y, b.position.z, b.quaternion.x, b.quaternion.y, b.quaternion.z, b.quaternion.w]));
}
const all = [...balls, ...dyn];
let camY = 9;
function render(t) {
  const f = REC[Math.min(N - 1, Math.round(t * FPS))];
  all.forEach((o, i) => { const p = f[i]; o.m.position.set(p[0], p[1], p[2]); o.m.quaternion.set(p[3], p[4], p[5], p[6]); });
  const ys = balls.map((o) => o.m.position.y), target = Math.max(-0.5, Math.min(9.5, (Math.min(...ys) + Math.max(...ys)) / 2));
  const xs = balls.map((o) => o.m.position.x), cx = (Math.min(...xs) + Math.max(...xs)) / 2 * 0.5;
  camY = target;
  cam.position.set(cx + 4, camY + 3, 14); cam.lookAt(cx, camY - 0.8, 0);
  renderer.render(scene, cam);
}
window.render = render; window.DUR = 14;
window.ready = Promise.resolve(true).then(() => { render(0); return true; });
</script></body></html>
