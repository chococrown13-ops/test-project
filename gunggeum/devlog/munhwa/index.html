<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:P;font-weight:400;src:url(../../tools/fonts/Pretendard-Regular.otf)}
@font-face{font-family:P;font-weight:600;src:url(../../tools/fonts/Pretendard-SemiBold.otf)}
@font-face{font-family:P;font-weight:800;src:url(../../tools/fonts/Pretendard-ExtraBold.otf)}
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script src="map/map.js"></script>
<script src="../../tools/mapkit.js"></script>
<script>
// 도시의 나이테 · 원래 ○○이었다 #12 「문화비축기지는 원래 출입 금지였다」 — render(t) 한 번 = 한 프레임.
// 실제 OpenStreetMap 바탕. 월드컵경기장에서 출발해 북서쪽 매봉산 자락의 기지로 카메라가 옮겨 가고,
// 통제 시절은 밤 톤 + 빨간 점선 울타리, 공원이 된 뒤는 밝은 톤 + 노란 테두리. 기지 경계는 OSM 공원 경계(대략).
const W=1080,H=1920,g=document.getElementById('c').getContext('2d');
const clamp01=x=>Math.max(0,Math.min(1,x));
function smooth(a,b,t){const u=clamp01((t-a)/(b-a));return u*u*(3-2*u)}
const lerp=(a,b,u)=>a+(b-a)*u;
function fade(t,a,b){return Math.min(smooth(a,a+.45,t),1-smooth(b-.45,b,t))}
let M,SITE,CEN=[1150,1350];
const P=n=>MapKit.place(M,n);
// 카메라: 경기장 근처(넓게) → 기지로 들어감(가깝게) → 끝에 살짝 물러남
function camAt(t){
  const u=smooth(1.2,7,t),back=smooth(24.5,28,t);
  return{cx:lerp(1230,1150,u),cy:lerp(1420,1345,u)+back*40,z:lerp(1.0,1.75,u)-back*0.35};
}
function toS(c,x,y){return[(x-c.cx)*c.z+W/2,(y-c.cy)*c.z+H*0.58]}
function world(c,fn){g.save();g.translate(W/2,H*0.58);g.scale(c.z,c.z);g.translate(-c.cx,-c.cy);fn();g.restore()}
function topText(year,head,sub,a){if(a<=0)return;g.save();g.globalAlpha=a;const y0=(1-a)*20;
  g.textAlign='center';g.fillStyle='#FFD54A';g.font='800 118px P';g.fillText(year,W/2,320+y0);
  g.fillStyle='#fff';g.font='800 62px P';g.fillText(head,W/2,420+y0);g.font='600 42px P';g.fillStyle='rgba(255,255,255,.92)';g.fillText(sub,W/2,488+y0);g.restore()}
function srcLine(s,a){if(a<=0||!s)return;g.save();g.globalAlpha=a;g.font='400 30px P';g.fillStyle='rgba(255,255,255,.88)';g.textAlign='center';g.fillText(s,W/2,H-90);g.restore()}
// 탱크 그림(장면 1, 6): 기록의 "탱크 개수"만 보여 주는 아이콘 줄 — 실제 위치 아님
function tank(x,y,r,col,label,a){if(a<=0)return;g.save();g.globalAlpha=a;
  g.fillStyle=col;g.beginPath();g.ellipse(x,y-r*.9,r,r*.32,0,0,7);g.fill();g.fillRect(x-r,y-r*.9,2*r,r*.9);
  g.beginPath();g.ellipse(x,y,r,r*.32,0,0,7);g.fill();g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=3;
  g.beginPath();g.ellipse(x,y-r*.9,r,r*.32,0,0,7);g.stroke();
  g.fillStyle='#14202e';g.font='800 30px P';g.textAlign='center';g.fillText(label,x,y-r*.3);g.restore()}
const STOPS=[
 {a:3.4,b:8.9,year:'1976~78',head:'석유 탱크 5개를 지었어요',sub:'석유파동 뒤, 서울시민 한 달 치 6,907만 리터',src:'출처: 서울시 「서울의 공원」'},
 {a:9.3,b:14.9,year:'40여 년',head:'일반인은 들어갈 수 없었어요',sub:'1급 보안시설로 철저히 통제',src:'출처: 서울시 「서울의 공원」 · 서울신문'},
 {a:15.3,b:19.9,year:'월드컵 앞',head:'안전을 이유로 문을 닫았어요',sub:'바로 옆에 월드컵경기장이 들어서며',src:'출처: 서울시 「서울의 공원」'},
 {a:20.3,b:24.9,year:'2013',head:'시민 아이디어로 문화공간으로',sub:'탱크를 허물지 않고 살리기로',src:'출처: 서울시 「서울의 공원」'},
 {a:25.3,b:28.0,year:'2017.9.1',head:'공원으로 문을 열었어요',sub:'헐어 낸 탱크 철판으로 6번째 탱크 T6도',src:'출처: 서울시 미디어허브'}];
function render(t){
  g.fillStyle='#000';g.fillRect(0,0,W,H);
  const c=camAt(t);
  const night=smooth(2.8,3.8,t)*(1-smooth(19.8,21.2,t));   // 통제 시절은 밤 톤
  const park=smooth(20,21.5,t);
  world(c,()=>{
    MapKit.drawBase(g,M,{mix:{from:'light',to:'night',u:night}});
    // 지금 공원 (노랑) — 첫 장면, 2013 이후
    const hero=Math.max(1-smooth(2.8,3.6,t),park);
    MapKit.poly(g,SITE,{fill:'rgba(255,213,74,'+(.24*hero)+')',stroke:'rgba(255,179,0,'+hero+')',width:7});
    // 석유비축기지 시절 (주황 기름색 빗금)
    const oil=smooth(3.4,4.4,t)*(1-smooth(20,21.5,t));
    MapKit.poly(g,SITE,{fill:'rgba(196,110,40,'+(.45*oil)+')',hatch:'rgba(255,220,170,'+(.4*oil)+')'});
    // 출입 금지 울타리 (빨간 점선)
    const ban=smooth(9.4,10.4,t)*(1-smooth(20,21.5,t));
    MapKit.poly(g,SITE,{stroke:'rgba(240,70,60,'+ban+')',width:9,dash:[22,14]});
    // 문 닫은 시절 (회색 덮개)
    const shut=smooth(15.4,16.6,t)*(1-smooth(20,21.5,t));
    MapKit.poly(g,SITE,{fill:'rgba(90,96,108,'+(.55*shut)+')'});
  });
  // 이름표
  const st=P('월드컵경기장역'),sd=P('서울월드컵경기장');
  let [x,y]=toS(c,sd.x,sd.y);MapKit.pin(g,x,y,'서울월드컵경기장',{alpha:(1-smooth(2.95,3.4,t)),size:34,dy:80});
  [x,y]=toS(c,st.x,st.y);MapKit.pin(g,x,y,'월드컵경기장역',{alpha:(1-smooth(2.95,3.4,t)),size:32,dy:-70});
  // 옛 장면에도 지금 경기장 이름표 흐리게 ("같은 자리")
  [x,y]=toS(c,sd.x,sd.y);MapKit.pin(g,x,y,'지금 월드컵경기장',{alpha:.7*smooth(3.8,4.6,t)*(1-smooth(26.5,27.2,t)),size:28,dy:70});
  [x,y]=toS(c,CEN[0],CEN[1]);
  MapKit.label(g,x,y,'문화비축기지',{alpha:(1-smooth(2.95,3.4,t)),size:58,color:'#FFD54A'});
  MapKit.label(g,x,y,'석유비축기지 (대략)',{alpha:fade(t,4,15),size:46,color:'#ffe2c0'});
  MapKit.label(g,x,y+70,'출입 금지',{alpha:fade(t,9.8,14.9),size:56,color:'#ff6a5e'});
  MapKit.label(g,x,y,'문 닫음',{alpha:fade(t,15.6,19.9),size:52,color:'#fff'});
  MapKit.label(g,x,y,'시민 아이디어 공모',{alpha:fade(t,20.6,24.9),size:46,color:'#FFD54A'});
  MapKit.label(g,x,y,'문화비축기지',{alpha:fade(t,25.4,28.2),size:66,color:'#fff'});
  // 탱크 아이콘 줄 (실제 위치 아님)
  const tk=fade(t,4.2,8.9),tk6=fade(t,25.8,28.0);
  for(let i=0;i<5;i++)tank(W/2+(i-2)*130,640,46,'#e08a3c','T'+(i+1),tk*smooth(4.2+i*.35,4.7+i*.35,t));
  for(let i=0;i<6;i++)tank(W/2+(i-2.5)*120,640,42,i==5?'#FFD54A':'#c7d0dc','T'+(i+1),tk6*(i==5?smooth(26.4,27,t):1));
  // 위·아래 그늘 + 태그
  let gr=g.createLinearGradient(0,0,0,720);gr.addColorStop(0,'rgba(8,14,24,.84)');gr.addColorStop(1,'rgba(8,14,24,0)');g.fillStyle=gr;g.fillRect(0,0,W,720);
  gr=g.createLinearGradient(0,H-300,0,H);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.6)');g.fillStyle=gr;g.fillRect(0,H-300,W,300);
  // 그늘 뒤에 그린 탱크가 가리지 않게 다시
  for(let i=0;i<5;i++)tank(W/2+(i-2)*130,640,46,'#e08a3c','T'+(i+1),tk*smooth(4.2+i*.35,4.7+i*.35,t));
  for(let i=0;i<6;i++)tank(W/2+(i-2.5)*120,640,42,i==5?'#FFD54A':'#c7d0dc','T'+(i+1),tk6*(i==5?smooth(26.4,27,t):1));
  g.font='800 32px P';g.textAlign='left';const tag='도시의 나이테 · 원래 ○○이었다 #12';const tw=g.measureText(tag).width+48;g.fillStyle='rgba(255,213,74,.95)';MapKit._round(g,56,72,tw,60,30);g.fill();g.fillStyle='#1b1430';g.fillText(tag,80,113);
  const h=1-smooth(2.85,3.3,t);  // 첫 프레임부터 훅 문장이 보이게
  if(h>0){g.save();g.globalAlpha=h;g.textAlign='center';g.fillStyle='#fff';g.font='800 100px P';g.fillText('문화비축기지는 원래',W/2,330);g.fillStyle='#FFD54A';g.font='800 128px P';g.fillText('출입 금지였다',W/2,466);g.font='600 44px P';g.fillStyle='rgba(255,255,255,.92)';g.fillText('월드컵경기장 바로 옆 매봉산 자락',W/2,540);g.restore()}
  for(const s of STOPS)topText(s.year,s.head,s.sub,fade(t,s.a,s.b));
  for(const s of STOPS)srcLine(s.src,fade(t,s.a,s.b));
  // 지도 장치
  MapKit.inset(g,M,56,1260,170,{alpha:1,t,label:'서울'});
  MapKit.north(g,990,1500);MapKit.scale(g,M,70,1580,c.z);
  MapKit.legend(g,70,1660,[['#c46e28','석유비축기지 자리(대략)',true],['#f0463c','출입 통제 울타리(대략)']],{alpha:fade(t,3.8,15)});
  MapKit.legend(g,70,1660,[['#5a606c','문 닫은 기지(대략)']],{alpha:fade(t,15.6,20.2)});
  MapKit.legend(g,70,1660,[['#ffb300','지금 문화비축기지']],{alpha:fade(t,20.6,28)});
  // 끝
  const e=smooth(28,28.7,t);
  if(e>0){g.fillStyle='rgba(10,14,28,'+(.66*e)+')';g.fillRect(0,0,W,H);g.save();g.globalAlpha=e;g.textAlign='center';g.fillStyle='#fff';g.font='800 74px P';g.fillText('다음엔 어떤 동네가',W/2,840);g.fillStyle='#FFD54A';g.font='800 90px P';g.fillText('궁금하세요?',W/2,950);
    g.font='600 42px P';g.fillStyle='rgba(255,255,255,.92)';g.fillText('댓글로 신청해 주세요',W/2,1040);g.font='400 30px P';g.fillStyle='rgba(255,255,255,.85)';g.fillText('그림은 기록을 바탕으로 단순화한 거예요',W/2,H-90);g.restore()}
  MapKit.credit(g,M,W,H);
}
window.render=render;
window.ready=Promise.all([document.fonts.load('800 40px P'),document.fonts.load('600 40px P'),document.fonts.load('400 40px P')]).then(()=>MapKit.load('map/')).then(m=>{M=m;SITE=MapKit.area(M,'문화비축기지, 마포구, 서울');render(0);return true});
</script></body></html>
