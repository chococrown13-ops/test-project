name: Weekly Quant Screening

on:
  schedule:
    - cron: "0 22 * * 5"  # 매주 금요일 22:00 UTC = 토요일 07:00 KST
  workflow_dispatch: {}

# quant/history/에 이번 주 스크리닝 결과를 커밋해야 다음 주 브리핑이 비교 대상으로 쓴다
permissions:
  contents: write

jobs:
  screening:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quant
    steps:
      - uses: actions/checkout@v4
        with:
          # history/ 커밋을 rebase 후 푸시하므로 얕은 클론이면 안 된다
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      # 스크리닝 실행과 이후 스텝이 자정을 사이에 두면 파일명이 어긋나므로 기준일을 한 번만 정한다
      - name: Resolve run date
        id: run_date
        run: echo "as_of=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Run screening and write weekly brief
        run: bash scripts/weekly_screening.sh
        env:
          AS_OF: ${{ steps.run_date.outputs.as_of }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_ACCOUNT_PRODUCT_CD: ${{ secrets.KIS_ACCOUNT_PRODUCT_CD }}
          KIS_ENV: ${{ secrets.KIS_ENV }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          # 없으면 해설 없이 비교표만 담긴 브리핑이 나온다 (워크플로는 실패하지 않음)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: screening-result
          path: |
            quant/out/*.csv
            quant/out/*.md
          if-no-files-found: warn

      # 이번 주 CSV가 저장소에 남아야 다음 주 실행이 "지난주 대비"를 계산할 수 있다
      - name: Archive screening result to repository
        run: |
          if [ -z "$(git status --porcelain history)" ]; then
            echo "보관할 변경 없음 — 커밋을 건너뜁니다"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          git commit -m "Archive weekly screening result for ${{ steps.run_date.outputs.as_of }}"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Load brief into email body
        id: brief
        run: |
          {
            echo "body<<QUANT_BRIEF_EOF"
            cat "out/brief_${{ steps.run_date.outputs.as_of }}.md"
            echo "QUANT_BRIEF_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Email screening result
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: Quant Screening Bot <${{ secrets.GMAIL_USERNAME }}>
          to: ${{ secrets.GMAIL_USERNAME }}
          subject: "주간 퀀트 스크리닝 브리핑 (${{ steps.run_date.outputs.as_of }})"
          body: |
            ${{ steps.brief.outputs.body }}

            ---
            원본 CSV가 첨부되어 있습니다.
            전체 실행 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          attachments: quant/out/*.csv,quant/out/*.md
