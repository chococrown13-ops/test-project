<script type="module">
import { SLOTS, ITEMS, RARE_NAME, GIFTS_PER_DAY, FRAG_COST, GAME_DAILY_FRAG, cleanText as clean } from "./rules.js";
import { newGame, step as gameStep, score as gameScore, TPS, MAX_TICKS, W as GW, H as GH, PLAYER_Y, PLAYER_R } from "./game.js";
(() => {
if (!window.THREE) { document.body.insertAdjacentHTML("beforeend", '<div class="fail">3D 화면을 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.</div>'); return; }
const $ = (id) => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

const kstDay = () => kstNow().toISOString().slice(0, 10);
const rnd = (seed) => () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
const hashStr = (s) => { let h = 2166136261; for (const c of String(s)) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; };

// ---------- 마을 설정 ----------
const HATS = ["#e2483d", "#3d6fe2", "#2fa36b", "#9a5ae2", "#f0a33a", "#e26aa8", "#3fb6c9"];
const NICKS = ["눈송이", "호빵", "귤", "솜사탕", "별빛", "방울", "털장갑", "코코아", "붕어빵", "군고구마", "포근이", "눈꽃", "말랑", "꼬마전구"];
const V = {

    spots: [{ id: "tree", x: 0, z: -7, r: 4.2, acts: [["소원 장식 달기", "wish"], ["달린 소원 보기", "list"]] },
            { id: "mail", x: 5.5, z: -3, r: 2, acts: [["산타에게 편지", "letter"]] },

    spots: [{ id: "deck", x: 0, z: -9, r: 3, acts: [["해넘이 보기", "sunset"], ["해돋이 보기", "sunrise"]] },
            { id: "lantern", x: -7, z: -2, r: 2.8, acts: [["소원 풍등 날리기", "wish"], ["날린 소원 보기", "list"]] },

};
let vk = store.get("village", "santa"); if (!V[vk]) vk = "santa";

// ---------- 서버 ----------
let token = store.get("vtoken", null), profile = null;
async function api(path, body) {
  const r = await fetch("/api/" + path, body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ token, ...body }) } : {});
  let data = {}; try { data = await r.json(); } catch {}
  if (!r.ok) throw Object.assign(new Error(data.error || "error"), { data, status: r.status });
  return data;
}
function useProfile(p) {
  profile = p; me.nick = p.nick; me.hat = p.hat | 0; me.look = validLook(String(p.look || "000000").split("").map(Number));
  owned.clear(); (p.owned || []).forEach((x) => owned.add(x));
}

// ---------- 3D 기본 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.75));
renderer.outputEncoding = THREE.sRGBEncoding;
$("world").append(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 400);
const hemi = new THREE.HemisphereLight(0x9fb4ff, 0x40406a, 0.75); scene.add(hemi);
const sunLight = new THREE.DirectionalLight(0xffffff, 0.5); sunLight.position.set(-10, 20, 10); scene.add(sunLight);
let world = new THREE.Group(); scene.add(world);
const M = (color, extra = {}) => new THREE.MeshLambertMaterial({ color, ...extra });
const glowM = (color) => new THREE.MeshBasicMaterial({ color });
function add(geo, mat, x = 0, y = 0, z = 0, parent = world) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); parent.add(m); return m; }
const shadowGeo = new THREE.CircleGeometry(0.7, 20), shadowMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.22, depthWrite: false });

// ---------- 꾸미기 아이템 (선물에서 랜덤으로 나옴) ----------
// slot: n 코 · a 팔 · h 머리 · c 목 · f 얼굴 · d 손. rare: 0 흔함 · 1 귀함 · 2 아주 귀함. 각 칸 0번은 처음부터 가진 기본.
const DEFAULT_LOOK = { n: 0, a: 0, h: 0, c: 0, f: 0, d: 0 };
function validLook(k) { const o = { ...DEFAULT_LOOK }; if (Array.isArray(k)) SLOTS.forEach(([sl], i) => { const v = k[i] | 0; if (v >= 0 && v < ITEMS[sl].length) o[sl] = v; }); return o; }
const lookArr = (l) => SLOTS.map(([sl]) => l[sl] | 0);

// ---------- 캐릭터: 눈사람(산타마을) · 털모자 동글이(해맞이마을) ----------
function makeAvatar(kind, hat, look = DEFAULT_LOOK) {
  const g = new THREE.Group(), white = M(0xf7f9ff), hatM = M(hat), stick = M(0x5a3d2b), black = M(0x222233);
  const sh = new THREE.Mesh(shadowGeo, shadowMat); sh.rotation.x = -Math.PI / 2; sh.position.y = 0.02; g.add(sh);
  const body = new THREE.Group(); g.add(body);
  const snow = kind === "santa";
  // 머리 높이·크기 (아이템 붙일 기준)
  const headY = snow ? 1.42 : 1.0, headR = snow ? 0.44 : 0.72, topY = snow ? 1.82 : 1.55, faceZ = snow ? 0.4 : 0.66, eyeY = snow ? 1.53 : 0.95;
  if (snow) {
    add(new THREE.SphereGeometry(0.62, 20, 16), white, 0, 0.6, 0, body);
    add(new THREE.SphereGeometry(0.44, 20, 16), white, 0, 1.42, 0, body);
    for (const sx of [-1, 1]) add(new THREE.SphereGeometry(0.045, 8, 6), black, sx * 0.15, 1.53, 0.4, body);
    // 코
    if (look.n === 3) add(new THREE.SphereGeometry(0.11, 12, 10), new THREE.MeshBasicMaterial({ color: 0xff2a2a }), 0, 1.42, 0.45, body);
    else if (look.n === 4) add(new THREE.SphereGeometry(0.07, 10, 8), black, 0, 1.42, 0.44, body);
    else if (look.n === 5) { const pc = add(new THREE.ConeGeometry(0.09, 0.22, 8), M(0x7a4a26), 0, 1.42, 0.52, body); pc.rotation.x = Math.PI / 2; }
    else { const len = [0.32, 0.18, 0.55][look.n] || 0.32; const nose = add(new THREE.ConeGeometry(look.n === 2 ? 0.08 : 0.06, len, 10), M(0xff8a2a), 0, 1.42, 0.4 + len / 2, body); nose.rotation.x = Math.PI / 2; }
    // 팔 (바깥 끝 = x ±1.03, y 0.79)
    if (look.a !== 4) for (const sx of [-1, 1]) {
      const mat = look.a === 3 ? M(0xffffff) : stick;
      add(new THREE.CylinderGeometry(0.028, 0.034, 0.72, 6), mat, sx * 0.72, 0.95, 0, body).rotation.z = sx * 1.1;
      if (look.a === 1) add(new THREE.CylinderGeometry(0.018, 0.022, 0.26, 5), stick, sx * 0.92, 0.92, 0, body).rotation.z = sx * 0.3;
      if (look.a === 2) add(new THREE.SphereGeometry(0.12, 10, 8), hatM, sx * 1.06, 0.78, 0, body);
      if (look.a === 3) { for (let k = 0; k < 3; k++) add(new THREE.CylinderGeometry(0.036, 0.036, 0.06, 6), M(0xe0322f), sx * (0.5 + k * 0.2), 1.07 - k * 0.1, 0, body).rotation.z = sx * 1.1; const hook = add(new THREE.TorusGeometry(0.09, 0.032, 6, 12, Math.PI), M(0xe0322f), sx * 1.08, 0.86, 0, body); hook.rotation.z = sx > 0 ? -0.4 : Math.PI + 0.4; }
    }
  } else {
    const bodyM = M(new THREE.Color(hat).lerp(new THREE.Color(0xffffff), 0.55));
    add(new THREE.SphereGeometry(0.72, 22, 18), bodyM, 0, 0.78, 0, body).scale.set(1, 1.06, 1);
    for (const sx of [-1, 1]) { add(new THREE.SphereGeometry(0.055, 8, 6), M(0x2a2233), sx * 0.2, 0.95, 0.66, body); add(new THREE.SphereGeometry(0.09, 10, 8), M(0xff9aa8), sx * 0.36, 0.82, 0.58, body).scale.set(1, 0.6, 0.5); }

  // 머리
  if (look.h === 0) {
    if (snow) { add(new THREE.CylinderGeometry(0.3, 0.38, 0.32, 16), hatM, 0, 1.82, 0, body); add(new THREE.SphereGeometry(0.09, 10, 8), white, 0, 2.03, 0, body); }
    else { add(new THREE.SphereGeometry(0.5, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2), hatM, 0, 1.2, 0, body); add(new THREE.SphereGeometry(0.13, 10, 8), M(0xffffff), 0, 1.72, 0, body); }
  } else if (look.h === 1) {

    el.append(h("h2", { textContent: "눈덩이 피하기" }), h("p", { textContent: "손가락(또는 ← →)으로 눈사람을 움직여 떨어지는 눈덩이를 피하세요. 목숨 3개, 선물을 받으면 +50점. 버틴 만큼 점수가 올라요." }));
    el.append(h("p", { textContent: `이번 주 순위는 월요일 0시에 새로 시작해요. 주간 1등은 「눈싸움왕 왕관」, 2~10등은 「황금 눈덩이」 한정 꾸미기를 받아요. 하루 처음 ${GAME_DAILY_FRAG}판은 판마다 눈송이 조각 1개.` }));
    if (r?.me) el.append(h("p", { textContent: `이번 주 내 최고 ${r.me.best}점 · ${r.me.rank}등 / ${r.players}명` }));
    el.append(h("div", { className: "row" }, [h("button", { className: "btn ghost", textContent: "마을로", onclick: closeGame }), h("button", { className: "btn ghost", textContent: "순위 보기", onclick: showRank }), h("button", { className: "btn", textContent: "시작", onclick: startGame })]));
  });
}
async function showRank() {
  const r = await loadRank();
  gPanel((el) => {
    el.append(h("h2", { textContent: "이번 주 순위" }), h("p", { textContent: r ? `${r.week} 주 · ${r.players}명 참가` : "순위를 불러오지 못했어요." }));
    const ol = h("ol", { className: "rank" });
    (r?.top || []).forEach((x, i) => { const li = h("li", {}, [h("b", { textContent: String(i + 1) }), h("span", { textContent: x.nick }), h("span", { textContent: x.best + "점" })]); if (x.nick === me.nick) li.className = "me"; ol.append(li); });
    if (r && !r.top.length) el.append(h("p", { textContent: "아직 아무도 없어요. 첫 1등이 되어 보세요!" }));
    el.append(ol);
    if (r?.me && r.me.rank > 20) el.append(h("p", { textContent: `내 순위 ${r.me.rank}등 · ${r.me.best}점` }));
    el.append(h("div", { className: "row" }, [h("button", { className: "btn ghost", textContent: "마을로", onclick: closeGame }), h("button", { className: "btn", textContent: "한 판 하기", onclick: startGame })]));
  });
}
async function startGame() {
  $("gpanel").hidden = true;
  let start; try { start = await api("game/start", {}); } catch (e) { gPanel((el) => { el.append(h("h2", { textContent: "지금은 시작할 수 없어요" }), h("p", { textContent: e.data?.why || "잠시 뒤 다시 해 주세요." }), h("div", { className: "row" }, [h("button", { className: "btn", textContent: "마을로", onclick: closeGame })])); }); return; }
  const run = { g: newGame(start.seed), gid: start.gid, inputs: [], target: GW / 2, acc: 0, last: performance.now(), flash: 0 };
  gRun = run; requestAnimationFrame(gameFrame);
}
function pointerToGame(e) { const r = gcv.getBoundingClientRect(); return Math.round((e.clientX - r.left) / r.width * GW); }
gcv.addEventListener("pointerdown", (e) => { if (gRun) { gRun.target = pointerToGame(e); gcv.setPointerCapture?.(e.pointerId); } });
gcv.addEventListener("pointermove", (e) => { if (gRun && (e.buttons || e.pointerType !== "mouse")) gRun.target = pointerToGame(e); });
gcv.addEventListener("mousemove", (e) => { if (gRun) gRun.target = pointerToGame(e); });
function gameFrame(now) {
  const run = gRun; if (!run || !gameOn) return;
  if (keys.has("ArrowLeft") || keys.has("a")) run.target = Math.max(0, run.target - 22);
  if (keys.has("ArrowRight") || keys.has("d")) run.target = Math.min(GW, run.target + 22);
  run.acc += Math.min(250, now - run.last); run.last = now;
  const dtk = 1000 / TPS;
  while (run.acc >= dtk && !run.g.over) {
    run.acc -= dtk; run.inputs.push(run.target | 0); gameStep(run.g, run.target);
    if (run.g.hit) { sfx.hit(); run.flash = 8; } if (run.g.got) sfx.chime();
  }
  drawGame(run, run.acc / dtk);
  $("g-lives").textContent = "❤️".repeat(Math.max(0, run.g.lives)) + "🤍".repeat(3 - Math.max(0, run.g.lives));
  $("g-score").textContent = `${gameScore(run.g)}점`;
  if (run.g.over) { finishGame(run); return; }
  requestAnimationFrame(gameFrame);
}
async function finishGame(run) {
  gRun = null; run.flash = 0; drawGame(run);
  let res = null; try { res = await api("game/end", { gid: run.gid, inputs: run.inputs }); useProfile(res.profile); } catch {}
  loadRank();
  gPanel((el) => {
    el.append(h("h2", { textContent: run.g.tick >= MAX_TICKS ? "끝까지 버텼어요!" : "눈덩이에 맞았어요" }));
    el.append(h("div", { className: "big", textContent: `${res ? res.score : gameScore(run.g)}점` }));
    if (res) {
      el.append(h("p", { textContent: `${res.seconds}초 버팀 · 선물 ${res.gifts}개${res.isBest ? " · 이번 주 내 최고 기록!" : ""}` }));
      if (res.rank) el.append(h("p", { textContent: `이번 주 ${res.rank.rank}등 (최고 ${res.rank.best}점)` }));
      el.append(h("p", { textContent: res.frag ? `눈송이 조각 +1 (오늘 남은 보상 ${res.playsLeft}판)` : "오늘 조각 보상은 다 받았어요. 순위 도전은 계속할 수 있어요." }));
    } else el.append(h("p", { textContent: "이번 판은 기록하지 못했어요. 연결을 확인하고 다시 해 주세요." }));
    el.append(h("div", { className: "row" }, [h("button", { className: "btn ghost", textContent: "마을로", onclick: closeGame }), h("button", { className: "btn ghost", textContent: "순위 보기", onclick: showRank }), h("button", { className: "btn", textContent: "다시 하기", onclick: startGame })]));
  });
}
function drawGame(run, a = 0) {
  const cw = gcv.width, ch = gcv.height, k = cw / GW;
  const sky = gg.createLinearGradient(0, 0, 0, ch); sky.addColorStop(0, "#0e1a44"); sky.addColorStop(0.75, "#2a3a74"); sky.addColorStop(1, "#dfe8f6");
  gg.fillStyle = sky; gg.fillRect(0, 0, cw, ch);
  gg.fillStyle = "#eef3fb"; gg.fillRect(0, (PLAYER_Y + 40) * k, cw, ch);
  for (let i = 0; i < 40; i++) { gg.fillStyle = "rgba(255,255,255,.5)"; gg.fillRect((i * 97) % cw, ((i * 53 + (run ? run.g.tick * (1 + i % 3) : 0)) % (ch * 0.8)), 2, 2); }
  if (!run) return;
  const g = run.g, lerp = (p, c) => p + (c - p) * a;
  for (const p of g.presents) { const x = lerp(p.px || p.x, p.x) * k, y = lerp(p.py || p.y, p.y) * k, r = p.r * k; gg.fillStyle = "#e2483d"; gg.fillRect(x - r * 0.8, y - r * 0.7, r * 1.6, r * 1.4); gg.fillStyle = "#ffe27a"; gg.fillRect(x - r * 0.15, y - r * 0.7, r * 0.3, r * 1.4); gg.fillRect(x - r * 0.8, y - r * 0.12, r * 1.6, r * 0.24); }
  for (const b of g.balls) { const x = lerp(b.px || b.x, b.x) * k, y = lerp(b.py || b.y, b.y) * k, r = b.r * k; gg.fillStyle = "#ffffff"; gg.beginPath(); gg.arc(x, y, r, 0, 7); gg.fill(); gg.fillStyle = "rgba(150,170,210,.45)"; gg.beginPath(); gg.arc(x + r * 0.25, y + r * 0.25, r * 0.7, 0, 7); gg.fill(); gg.fillStyle = "#fff"; gg.beginPath(); gg.arc(x - r * 0.25, y - r * 0.25, r * 0.4, 0, 7); gg.fill(); }
  // 눈사람
  const px = g.x * k, py = PLAYER_Y * k, pr = PLAYER_R * k;
  if (!(g.inv > 0 && g.inv % 4 < 2)) {
    gg.fillStyle = "rgba(0,0,0,.15)"; gg.beginPath(); gg.ellipse(px, py + pr * 0.95, pr * 0.9, pr * 0.22, 0, 0, 7); gg.fill();
    gg.fillStyle = "#fff"; gg.beginPath(); gg.arc(px, py + pr * 0.2, pr * 0.78, 0, 7); gg.fill(); gg.beginPath(); gg.arc(px, py - pr * 0.75, pr * 0.55, 0, 7); gg.fill();
    gg.fillStyle = HATS[me.hat % HATS.length]; gg.fillRect(px - pr * 0.45, py - pr * 1.45, pr * 0.9, pr * 0.35); gg.fillRect(px - pr * 0.55, py - pr * 0.35, pr * 1.1, pr * 0.16);
    gg.fillStyle = "#222"; gg.fillRect(px - pr * 0.22, py - pr * 0.85, pr * 0.1, pr * 0.1); gg.fillRect(px + pr * 0.12, py - pr * 0.85, pr * 0.1, pr * 0.1);
    gg.fillStyle = "#ff8a2a"; gg.beginPath(); gg.moveTo(px, py - pr * 0.72); gg.lineTo(px + pr * 0.4, py - pr * 0.64); gg.lineTo(px, py - pr * 0.6); gg.fill();
  }
  if (run.flash > 0) { gg.fillStyle = `rgba(255,120,120,${run.flash / 20})`; gg.fillRect(0, 0, cw, ch); run.flash--; }
}
