<!doctype html>
<html><head><meta charset="utf-8"><style>@font-face{font-family:P;font-weight:800;src:url(../../../../gunggeum/tools/fonts/Pretendard-ExtraBold.otf)}html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script src="../../../physics/vendor/three-gltf-0.149.0.min.js"></script>
<script src="timeline.js"></script>
<script src="vrm.js"></script>
<script src="../../tools/engine2.js"></script>
<script>
// 웹툰·애니 체형 시험(2026-11-14): 민재 = VRoid 샘플(桜田 史利矢, 상업 이용·수정 허용) 머리·눈·옷 색을 바꿔 씀. 1795 밤 거리, 댕이와 대화 4줄
window.ready = (async () => {
const Q = new URLSearchParams(location.search), L = TL.lines;
const S = Story.init({ w: 1920, h: 1080, bg: '#141a33', titleAt: [-9, -8], end: [], post: { bloom: 0.7, vignette: 0.45, grade: 'saturate(1.1) contrast(1.05)' }, ss: +(Q.get('ss') || 1), aa: true, softShadow: false });
const { scene } = S, M = Story.mesh, sm = Story.smooth;
window.CAST_STYLE = { 민재: { name: '민재', color: '#ffb35c' }, 댕이: { name: '댕이', color: '#bfeaff' } };
const hemi = scene.children.find((o) => o.isHemisphereLight), sun = scene.children.find((o) => o.isDirectionalLight);
hemi.intensity = 0.55; sun.intensity = 0.6; sun.color.set('#c4d0ff'); scene.fog = new THREE.Fog('#141a33', 12, 40);
// ---- 배경: 1795 한양 밤거리(간단판) ----
const tex = (w, h, f, rep) => { const c = document.createElement('canvas'); c.width = w; c.height = h; f(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...rep); return t; };
const dirt = tex(256, 256, (x, w, h) => { x.fillStyle = '#7d6a52'; x.fillRect(0, 0, w, h); for (let i = 0; i < 1400; i++) { x.fillStyle = i % 3 ? 'rgba(60,45,30,.25)' : 'rgba(170,150,120,.25)'; x.fillRect(Math.abs(Math.sin(i * 12.99) * 43758 % 1) * w, Math.abs(Math.sin(i * 78.23) * 12345 % 1) * h, 2 + (i % 4), 2); } }, [10, 6]);
const roofT = tex(256, 64, (x, w, h) => { x.fillStyle = '#4a4f5a'; x.fillRect(0, 0, w, h); for (let i = 0; i < w; i += 16) { x.fillStyle = '#2f333b'; x.fillRect(i, 0, 5, h); } }, [3, 1]);
const hanji = tex(128, 128, (x, w, h) => { x.fillStyle = '#efe6d2'; x.fillRect(0, 0, w, h); x.strokeStyle = 'rgba(120,90,60,.35)'; x.lineWidth = 3; for (let i = 0; i <= 4; i++) { x.beginPath(); x.moveTo(i * 32, 0); x.lineTo(i * 32, h); x.moveTo(0, i * 32); x.lineTo(w, i * 32); x.stroke(); } }, [3, 1]);
M(new THREE.BoxGeometry(60, 0.1, 40), null, [0, -0.05, -8], scene, { line: 0, mat: Story.toon('#ffffff', { map: dirt }) });
function giwa(x, z, w, ry = 0) { const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = ry; scene.add(g);
  M(new THREE.BoxGeometry(w, 0.4, 2.6), '#8d8577', [0, 0.2, 0], g); M(new THREE.BoxGeometry(w - 0.3, 1.7, 2.2), null, [0, 1.25, 0], g, { mat: Story.toon('#ffffff', { map: hanji }) });
  const r = M(new THREE.CylinderGeometry(0.4, 2.2, 1.1, 4, 1), null, [0, 2.6, 0], g, { mat: Story.toon('#ffffff', { map: roofT }) }); r.rotation.y = Math.PI / 4; r.scale.set(w / 2.6, 1, 1.1); }
function choga(x, z, ry = 0) { const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = ry; scene.add(g); M(new THREE.BoxGeometry(2.4, 1.5, 2.0), '#d9c7a3', [0, 0.75, 0], g); const r = M(new THREE.SphereGeometry(1.6, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), '#c9a35c', [0, 1.45, 0], g); r.scale.set(1, 0.55, 0.9); return g; }
giwa(-4.2, -5.5, 5.0); giwa(3.6, -6.5, 4.4, -0.15); choga(-9, -4.5, 0.3); choga(8.5, -4.2, -0.3); giwa(13, -7, 5); giwa(-13.5, -7, 5);
const glowT = tex(128, 128, (x) => { const r = x.createRadialGradient(64, 64, 2, 64, 64, 64); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.3, 'rgba(255,255,255,.35)'); r.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = r; x.fillRect(0, 0, 128, 128); }, [1, 1]);
for (const [x, z] of [[-1.6, -2.6], [2.6, -3.0], [-6.5, -2.4], [6.8, -2.6]]) { M(new THREE.CylinderGeometry(0.04, 0.04, 2.2, 8), '#4a3324', [x, 1.1, z], scene, { line: 0 });
  const lb = M(new THREE.BoxGeometry(0.34, 0.46, 0.34), null, [x, 2.35, z], scene, { mat: new THREE.MeshBasicMaterial({ color: '#ffc46e' }) }); Story.glow(lb);
  const pl = new THREE.PointLight('#ffb35c', 0.8, 7); pl.position.set(x, 2.4, z + 0.4); scene.add(pl);
  const h = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowT, color: '#ffb35c', transparent: true, opacity: 0.45, depthWrite: false, blending: THREE.AdditiveBlending, fog: false })); h.scale.set(1.9, 1.9, 1); h.position.set(x, 2.35, z + 0.1); scene.add(h); }
const moon = new THREE.Mesh(new THREE.CircleGeometry(1.4, 40), new THREE.MeshBasicMaterial({ color: '#fff6d8', fog: false })); moon.position.set(-9, 11, -30); scene.add(moon); Story.glow(moon);
for (let k = 0; k < 120; k++) { const a = k * 2.399, r = 22 + (k % 7) * 3; const st = new THREE.Mesh(new THREE.SphereGeometry(0.05 + (k % 3) * 0.02, 6, 4), new THREE.MeshBasicMaterial({ color: '#fff', fog: false })); st.position.set(Math.cos(a) * r, 7 + (k * 37 % 13), -30 - Math.sin(a) * 4); scene.add(st); }

// ---- 민재 (VRoid) ----
const bin = Uint8Array.from(atob(window.VRM_B64), (c) => c.charCodeAt(0)).buffer;
const gltf = await new Promise((ok, no) => new THREE.GLTFLoader().parse(bin, '', ok, no));
const mj = gltf.scene; mj.rotation.y = Math.PI; scene.add(mj);
const MJ_SCALE = 1.25; mj.scale.setScalar(MJ_SCALE);
// 색 바꾸기: 그림 픽셀을 직접 고침
function recolor(img, fn) { const c = document.createElement('canvas'); c.width = img.width; c.height = img.height; const g = c.getContext('2d'); g.drawImage(img, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height), p = d.data; for (let i = 0; i < p.length; i += 4) { const o = fn(p[i], p[i + 1], p[i + 2]); if (o) { p[i] = o[0]; p[i + 1] = o[1]; p[i + 2] = o[2]; } } g.putImageData(d, 0, 0);
  const t = new THREE.CanvasTexture(c); t.flipY = false; t.encoding = THREE.sRGBEncoding; return t; }
const lum = (r, g, b) => (0.3 * r + 0.59 * g + 0.11 * b) / 255;
const RULES = {
  HAIR: (r, g, b) => { const l = lum(r, g, b); return [20 + l * 34, 18 + l * 26, 20 + l * 26]; },                              // 은발 → 짙은 흑갈색
  EyeIris: (r, g, b) => { const l = lum(r, g, b); return [40 + l * 150, 24 + l * 92, 14 + l * 48]; },                          // 파란 눈 → 갈색
  FaceBrow: (r, g, b) => { const l = lum(r, g, b); return [30 + l * 60, 24 + l * 44, 22 + l * 40]; },
  Tops: (r, g, b) => { const l = lum(r, g, b); if (l < 0.55 && b >= r + 4 && b >= g - 6) return [30 + l * 70, 110 + l * 150, 70 + l * 90];   // 남색 조끼 → 배달 조끼(초록)
    if (r > 180 && g > 80 && g < 170 && b < 90) return [235, 200, 70]; return null; },                                           // 주황 넥타이 → 노란 띠
  Accessory: (r, g, b) => { const l = lum(r, g, b); if (r > g + 30 && r > b + 50) return [40 + l * 60, 90 + l * 110, 60 + l * 70]; return null; },   // 주황 넥타이 → 짙은 초록
  Bottoms: (r, g, b) => { const l = lum(r, g, b); return [40 + l * 60, 46 + l * 70, 66 + l * 90]; },                          // 바지 → 짙은 청바지
};
const grad = (() => { const d = new Uint8Array([130, 205, 255]); const t = new THREE.DataTexture(d, 3, 1, THREE.RedFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; })();
const mjMeshes = [];
mj.traverse((o) => { if (!o.isMesh) return; o.frustumCulled = false; o.castShadow = true; mjMeshes.push(o);
  const ms = Array.isArray(o.material) ? o.material : [o.material];
  const nm = ms.map((m) => { let map = m.map || null; const key = Object.keys(RULES).find((k) => m.name.includes(k)); if (map && key) map = recolor(map.image, RULES[key]); else if (map) map.encoding = THREE.sRGBEncoding;
    const t = new THREE.MeshToonMaterial({ map, color: m.color || new THREE.Color('#fff'), gradientMap: grad, transparent: !!m.transparent || /EYE|Brow|Eyelash|Eyeline|Mouth/.test(m.name), alphaTest: 0.3, side: THREE.DoubleSide }); t.name = m.name; return t; });
  o.material = Array.isArray(o.material) ? nm : nm[0]; });
for (const o of mjMeshes) { const ms = Array.isArray(o.material) ? o.material : [o.material]; if (ms.every((m) => m.transparent)) continue;
  const ink = new THREE.MeshBasicMaterial({ color: '#2a1f1a', side: THREE.BackSide }); ink.onBeforeCompile = (sh) => { sh.vertexShader = sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\ntransformed += normalize(objectNormal) * 0.0035;'); };
  const h = o.clone(); h.material = Array.isArray(o.material) ? o.material.map((m) => (m.transparent || /SKIN/.test(m.name) && /Face/.test(m.name) ? new THREE.MeshBasicMaterial({ visible: false }) : ink)) : (o.material.transparent ? new THREE.MeshBasicMaterial({ visible: false }) : ink); h.morphTargetInfluences = o.morphTargetInfluences; o.parent.add(h); }
// 배달 가방(등)
const B = {}; mj.traverse((o) => { if (o.name && o.name.startsWith('J_')) B[o.name] = o; });
const bag = new THREE.Group(); B.J_Bip_C_Chest.add(bag); M(new THREE.BoxGeometry(0.26, 0.3, 0.15), '#2f8f5a', [0, 0.0, 0.17], bag, { line: 1.05 }); M(new THREE.BoxGeometry(0.265, 0.05, 0.155), '#f2d36b', [0, 0.09, 0.17], bag, { line: 0 });
// 표정(VRM 표정 묶음 → 얼굴 모프)
const vrm = gltf.parser.json.extensions.VRM, faceMeshes = mjMeshes.filter((m) => m.morphTargetInfluences && m.morphTargetInfluences.length > 20);
const groups = {}; for (const g of vrm.blendShapeMaster.blendShapeGroups) groups[g.presetName === 'unknown' ? g.name : g.presetName] = g.binds;
const setBS = (name, w) => { for (const b of groups[name] || []) for (const m of faceMeshes) m.morphTargetInfluences[b.index] = w * b.weight / 100; };
const VIS = { A: null, B: ['i', 0.35], C: ['e', 0.7], D: ['a', 0.9], E: ['o', 0.8], F: ['u', 0.8], G: ['i', 0.3], H: ['a', 0.5], X: null };

// ---- 댕이 ----
const dg = Story.char({ type: 'bell', pos: [1.1, 2.0, 0.6], color: '#ffffff', glow: '#cdeeff', faceSize: 0.5, blinkOff: 1.9 }); scene.add(dg.g); dg.g.scale.setScalar(0.5);
dg.opt.naturalEyes = true;
const cast = { 댕이: dg };
// 서 있는 자세: 팔 내리고, 손 살짝 안으로
const rest = { J_Bip_L_UpperArm: [0, 0, 1.32], J_Bip_R_UpperArm: [0, 0, -1.32], J_Bip_L_LowerArm: [0, -0.18, 0], J_Bip_R_LowerArm: [0, 0.18, 0], J_Bip_L_Hand: [0, 0, 0.1], J_Bip_R_Hand: [0, 0, -0.1] };
for (const [n, r] of Object.entries(rest)) B[n] && B[n].rotation.set(...r);
const hsh = (n, s) => { const x = Math.sin(n * 12.9898 + s * 78.233) * 43758.5453; return x - Math.floor(x); };
const blinks = []; { let T = 0.9; for (let k = 0; T < 60; k++) { blinks.push(T); if (hsh(k + 7, 4.2) > 0.85) blinks.push(T + 0.3); T += 2.3 + 3.5 * hsh(k, 4.2); } }
function blinkAt(t) { let T = -1; for (const b of blinks) if (b <= t) T = b; if (T < 0) return 0; const d = t - T; return d < 0.07 ? d / 0.07 : d < 0.11 ? 1 : d < 0.23 ? 1 - (d - 0.11) / 0.12 : 0; }
const lineAt = (t) => L.find((l) => t >= l.start && t <= l.start + l.dur) || null;
function mouth(t) { const l = lineAt(t); for (const k of ['a', 'i', 'u', 'e', 'o']) setBS(k, 0); if (!l || l.who !== '민재' || !l.cues) return;
  const u = t - l.start; let cur = 'X', prev = 'X', t0 = 0; for (const [ct, v] of l.cues) if (ct <= u) { prev = cur; cur = v; t0 = ct; }
  const k = Math.min(1, (u - t0) / 0.06); const p = VIS[prev], c = VIS[cur]; if (p) setBS(p[0], p[1] * (1 - k)); if (c) setBS(c[0], (c[1]) * k); }
// 머리·눈이 댕이 쪽을 볼지(0~1): 댕이가 말할 때, 그리고 '날아다니는 종' 대사 때
function lookAtDaengi(t) { let w = 0; for (const l of L) { const on = (l.who === '댕이' || l.text.includes('날아다니는')) ? 1 : 0; if (!on) continue; w = Math.max(w, sm(l.start - 0.3, l.start + 0.2, t) * (1 - sm(l.start + l.dur + 0.1, l.start + l.dur + 0.6, t))); } return w; }

window.render = (t) => S.render(t, {
  cast, camK: 0.1,
  shot: (t, l) => {
    const h = new THREE.Vector3(); B.J_Bip_C_Head.getWorldPosition(h);
    const i = l ? L.indexOf(l) : 0;
    if (i === 1 || i === 3) return { pos: [h.x + 0.55, h.y - 0.05, 3.3], look: [h.x + 0.4, h.y - 0.2, 0.2], fov: 30, cut: t < l.start + 0.05 };                         // 둘이 같이
    if (i === 2) return { pos: [h.x - 0.3, h.y + 0.02, 1.9], look: [h.x, h.y - 0.08, 0], fov: 28, cut: t < l.start + 0.05 };                                             // 가까이
    return { pos: [h.x + 0.4, h.y - 0.2, 4.6], look: [h.x + 0.1, h.y - 0.75, 0], fov: 30 };                                                                              // 허리 위
  },
  update: (t, l) => {
    // 숨쉬기(아주 작게) + 말할 때만 고개 살짝
    const speak = l && l.who === '민재', w = lookAtDaengi(t);
    B.J_Bip_C_Chest.rotation.x = Math.sin(t * 1.6) * 0.012;
    B.J_Bip_C_Head.rotation.y = -0.38 * w + (speak ? Math.sin(t * 2.3) * 0.04 : 0);
    B.J_Bip_C_Head.rotation.x = -0.12 * w + (speak ? Math.sin(t * 3.1) * 0.025 : 0);
    B.J_Bip_C_Neck.rotation.y = -0.18 * w;
    // 눈: 댕이 쪽 + 1~2초마다 작은 움직임(0.1초 동안 옮겨 감)
    const seg = Math.floor(t / 1.4), sx = (hsh(seg, 9) - 0.5) * 0.12, sy = (hsh(seg + 50, 9) - 0.5) * 0.06;
    for (const n of ['J_Adj_L_FaceEye', 'J_Adj_R_FaceEye']) if (B[n]) { B[n].rotation.y = -0.22 * w + sx; B[n].rotation.x = -0.12 * w + sy; }
    setBS('blink', blinkAt(t)); setBS('fun', speak ? 0 : 0.15); setBS('sorrow', l && l.mood === 'tired' && speak ? 0.5 : 0); setBS('surprised', 0);
    if (l && l.mood === 'surprised' && speak) setBS('a', 0);
    mouth(t);
    // 댕이: 민재 옆에서 둥실
    const hp = new THREE.Vector3(); B.J_Bip_C_Head.getWorldPosition(hp);
    dg.g.position.set(hp.x + 0.75 + Math.sin(t * 0.9) * 0.05, hp.y - 0.12 + Math.sin(t * 2.4) * 0.04, 0.35);
    dg.g.rotation.y = -0.4;
  },
});
window.DUR = TL.dur;
await document.fonts.load('800 40px P'); window.render(0); return true;
})();
</script></body></html>
