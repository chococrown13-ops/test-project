<title>조선으로 회귀하다 스튜디오</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 레이아웃: 위 = 채널 간판(밤 한양 남색 띠), 아래 = 회차 보드 · 올리기 체크 · 자료실 세 칸. 도장 빨강은 상태 강조에만. */
:root{
  --bg:#f3eee3; --paper:#fbf8f1; --ink:#1c2433; --ink-soft:#56607a; --line:#d9cfbc;
  --night:#1b2a44; --night-ink:#eef1f7; --seal:#b3262c; --lantern:#e7a33a; --pine:#2f7a5b;
  --chip:#ece4d4;
  --display:"Gowun Batang","Noto Serif KR",serif; --body:"Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161f; --paper:#1a2030; --ink:#e9e6de; --ink-soft:#a3abbf; --line:#2e3750;
  --night:#0d1424; --night-ink:#eef1f7; --seal:#e0575c; --lantern:#f0b456; --pine:#5cc29a; --chip:#262e42; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161f; --paper:#1a2030; --ink:#e9e6de; --ink-soft:#a3abbf; --line:#2e3750;
  --night:#0d1424; --night-ink:#eef1f7; --seal:#e0575c; --lantern:#f0b456; --pine:#5cc29a; --chip:#262e42; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
.sign{background:var(--night);color:var(--night-ink);border-radius:14px;padding:20px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}
.sign img{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid var(--lantern);background:#22324f}
.sign h1{font-size:clamp(24px,4vw,34px)}
.sign p{margin:4px 0 0;color:#c4cbe0;font-size:13px}
.handle{font-weight:700;color:var(--lantern)}
.counts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.count{background:#ffffff14;border:1px solid #ffffff2e;border-radius:10px;padding:8px 12px;min-width:84px;text-align:center}
.count b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.count span{font-size:11px;color:#c4cbe0}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;color:var(--ink);text-decoration:none}
.links a:hover{border-color:var(--seal)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.panel-head h2{font-size:22px}
.panel-head small{color:var(--ink-soft);font-size:12px}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.ep{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:6px;background:var(--bg);cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.ep:hover,.ep:focus-visible{border-color:var(--seal);outline:none}
.ep.sel{border-color:var(--seal);box-shadow:0 0 0 2px var(--seal) inset}
.ep-no{font-family:var(--display);font-size:13px;color:var(--ink-soft)}
.ep-title{font-weight:700;font-size:14px;line-height:1.4}
.ep-due{font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.pill{justify-self:start;font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--chip);color:var(--ink)}
.pill.s-plan{background:var(--chip)}
.pill.s-script{background:#d7e3f2;color:#1c2433}
.pill.s-make{background:var(--lantern);color:#1c2433}
.pill.s-done{background:var(--pine);color:#fff}
.pill.s-up{background:var(--seal);color:#fff}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:20px;align-items:start}
.detail h3{font-family:var(--display);font-size:20px;margin:2px 0 6px}
.detail p{color:var(--ink-soft);font-size:13px;margin:0 0 12px;line-height:1.6}
.status-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.status-row button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.status-row button.on{background:var(--seal);border-color:var(--seal);color:#fff}
.status-row button:disabled{opacity:.6;cursor:default}
.checks{display:grid;gap:4px}
.group-label{font-size:12px;font-weight:900;color:var(--ink-soft);margin:10px 0 2px;letter-spacing:.02em}
.check{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;font-size:13px;cursor:pointer}
.check:hover{background:var(--bg)}
.check input{width:18px;height:18px;accent-color:var(--seal);flex:none}
.check.done span{color:var(--ink-soft);text-decoration:line-through}
.progress{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;margin:4px 0 8px}
.progress i{display:block;height:100%;background:var(--seal);transition:width .3s}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.file{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);display:grid;min-width:0}
.thumb{aspect-ratio:16/9;background:var(--night);display:grid;place-items:center;color:var(--night-ink);font-size:12px;overflow:hidden}
.thumb.v{aspect-ratio:9/16;max-height:220px}
.thumb img{width:100%;height:100%;object-fit:cover}
.file-body{padding:9px;display:grid;gap:6px}
.file-body b{font-size:12px;line-height:1.4;overflow-wrap:anywhere}
.file-body small{font-size:11px;color:var(--ink-soft)}
.dl{border:1px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:8px;padding:8px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.dl:hover{background:var(--ink);color:var(--paper)}
.dl:disabled{opacity:.6;cursor:progress}
.empty{color:var(--ink-soft);font-size:13px;padding:16px;border:1px dashed var(--line);border-radius:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--lantern);outline-offset:2px}
@media (max-width:820px){.two{grid-template-columns:1fr}.sign{grid-template-columns:auto 1fr}.counts{grid-column:1/-1;justify-content:flex-start}}
@media (max-width:420px){.sign img{width:64px;height:64px}.files{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="sign">
    <img id="profile" alt="채널 프로필: 놀란 민재">
    <div>
      <h1>조선으로 회귀하다</h1>
      <p><span class="handle">@조선으로회귀하다</span> · 2026년 배달 라이더가 1795년 한양에 떨어졌다</p>
    </div>
    <div class="counts">
      <div class="count"><b id="c-total">–</b><span>회차</span></div>
      <div class="count"><b id="c-done">–</b><span>완성</span></div>
      <div class="count"><b id="c-up">–</b><span>업로드</span></div>
    </div>
  </header>

  <nav class="links" aria-label="안내서">
    <a href="https://claude.ai/artifact/ShTZ8k4HxvjA2BRXT42yhw" target="_blank" rel="noopener">업로드 매뉴얼</a>
    <a href="https://claude.ai/artifact/6d8t1ru8GLxSN2xXmipZ3R" target="_blank" rel="noopener">SNS 계정 설정 매뉴얼</a>
    <a href="https://claude.ai/artifact/W4ym2MMMzq5snKeKZxRpSi" target="_blank" rel="noopener">도시의 나이테 스튜디오</a>
  </nav>

  <section class="panel" aria-labelledby="h-board">
    <div class="panel-head"><h2 id="h-board">시즌 1 회차 보드</h2><small>매주 화요일 저녁 7시 연재 · 회차를 누르면 아래에 올리기 체크가 열려요</small></div>
    <div class="board" id="board"><div class="empty">회차를 불러오는 중이에요.</div></div>
  </section>

  <div class="two">
    <section class="panel detail" aria-labelledby="h-detail">
      <div class="panel-head"><h2 id="h-detail">올리기 체크</h2><small id="save-state"></small></div>
      <div id="detail"><div class="empty">위에서 회차를 고르세요.</div></div>
    </section>
    <section class="panel" aria-labelledby="h-files">
      <div class="panel-head"><h2 id="h-files">자료실</h2><small id="files-note">영상·썸네일·프로필</small></div>
      <div class="files" id="files"><div class="empty">자료를 불러오는 중이에요.</div></div>
    </section>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const STATUS = [["plan","기획"],["script","대본"],["make","제작"],["done","완성"],["up","업로드"]];
const SLABEL = Object.fromEntries(STATUS);
const $ = (id) => document.getElementById(id);
let EPS = [], FILES = [], META = {}, SEL = null, db = null, downloads = null, canWrite = true;
try { SEL = localStorage.getItem("js-sel"); } catch (e) {}

function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove("on"),2400); }
function esc(s){ return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function mb(n){ return n ? (n/1048576).toFixed(n<10485760?1:0)+"MB" : ""; }

function renderCounts(){
  $("c-total").textContent = EPS.length || "–";
  $("c-done").textContent = EPS.filter(e => e.status==="done"||e.status==="up").length;
  $("c-up").textContent = EPS.filter(e => e.status==="up").length;
}
function renderBoard(){
  const b = $("board");
  if(!EPS.length){ b.innerHTML = '<div class="empty">아직 회차가 없어요. 사무실이 회차를 등록하면 여기에 나타나요.</div>'; return; }
  b.innerHTML = EPS.map(e => {
    const items = e.checklist||[], d = items.filter(x=>x.done).length;
    return `<button class="ep ${e.id===SEL?"sel":""}" data-id="${esc(e.id)}">
      <span class="ep-no">${esc(e.no)}화</span>
      <span class="ep-title">${esc(e.title)}</span>
      ${e.due ? `<span class="ep-due">${esc(e.due)} 저녁 7시 공개</span>` : ""}
      <span class="pill s-${esc(e.status)}">${esc(SLABEL[e.status]||e.status)}${items.length?` · 체크 ${d}/${items.length}`:""}</span>
    </button>`; }).join("");
  b.querySelectorAll(".ep").forEach(el => el.onclick = () => { SEL = el.dataset.id; try{localStorage.setItem("js-sel",SEL)}catch(e){} renderBoard(); renderDetail(); });
}
function renderDetail(){
  const e = EPS.find(x => x.id===SEL); const d = $("detail");
  if(!e){ d.innerHTML = '<div class="empty">위에서 회차를 고르세요.</div>'; return; }
  const items = e.checklist||[]; const done = items.filter(x=>x.done).length;
  let groups = []; items.forEach((it,i) => { const g = it.group||""; let G = groups.find(x=>x.g===g); if(!G){G={g,list:[]};groups.push(G)} G.list.push([it,i]); });
  d.innerHTML = `<h3>${esc(e.no)}화 · ${esc(e.title)}</h3>
    <p>${esc(e.note||"")}</p>
    <div class="status-row" role="group" aria-label="진행 상태">${STATUS.map(([k,l]) => `<button data-s="${k}" class="${e.status===k?"on":""}" ${canWrite?"":"disabled"}>${l}</button>`).join("")}</div>
    ${items.length ? `<div class="progress" aria-hidden="true"><i style="width:${Math.round(done/items.length*100)}%"></i></div>
    <div class="checks">${groups.map(G => `${G.g?`<div class="group-label">${esc(G.g)}</div>`:""}${G.list.map(([it,i]) => `
      <label class="check ${it.done?"done":""}"><input type="checkbox" id="ck-${esc(e.id)}-${i}" data-i="${i}" ${it.done?"checked":""} ${canWrite?"":"disabled"}><span>${esc(it.label)}</span></label>`).join("")}`).join("")}</div>`
    : '<div class="empty">이 회차는 아직 올릴 것이 없어요. 완성되면 체크 목록이 생겨요.</div>'}`;
  d.querySelectorAll(".status-row button").forEach(btn => btn.onclick = () => save(e, {status: btn.dataset.s}, `${SLABEL[btn.dataset.s]}(으)로 바꿨어요`));
  d.querySelectorAll(".check input").forEach(inp => inp.onchange = () => {
    const list = (e.checklist||[]).map((x,j) => j===+inp.dataset.i ? {...x, done: inp.checked} : {...x});
    save(e, {checklist: list}, inp.checked ? "체크했어요" : "체크를 풀었어요");
  });
}
async function save(e, patch, msg){
  if(!db){ toast("지금은 저장할 수 없어요"); return; }
  $("save-state").textContent = "저장 중…";
  try { await db.doc("episodes/"+e.id).update(patch); $("save-state").textContent = ""; toast(msg); }
  catch(err){ $("save-state").textContent = ""; toast(err && err.code==="permission_denied" ? "보기 권한만 있어서 바꿀 수 없어요" : "저장하지 못했어요. 잠시 뒤 다시 눌러 주세요"); renderDetail(); }
}
function renderFiles(){
  const f = $("files");
  if(!FILES.length){ f.innerHTML = '<div class="empty">아직 자료가 없어요. 사무실이 영상을 올리면 여기에 나타나요.</div>'; return; }
  const thumbId = META.thumb;
  f.innerHTML = FILES.map(x => {
    const vertical = /short/.test(x.id);
    const img = x.kind==="image" ? `/_blob/${x.parts[0]}` : (x.cover ? `/_blob/${x.cover}` : (!vertical && thumbId ? `/_blob/${thumbId}` : ""));
    return `<div class="file">
      <div class="thumb ${vertical?"v":""}">${img?`<img src="${esc(img)}" alt="" loading="lazy">`:`<span>${vertical?"세로 쇼츠":"영상"}</span>`}</div>
      <div class="file-body"><b>${esc(x.name)}</b><small>${esc(x.note||"")} ${mb(x.sizeBytes)?"· "+mb(x.sizeBytes):""}</small>
      <button class="dl" data-id="${esc(x.id)}" ${downloads?"":"hidden"}>받기</button></div></div>`; }).join("");
  f.querySelectorAll(".dl").forEach(b => b.onclick = () => grab(b));
}
async function grab(btn){
  const x = FILES.find(y => y.id===btn.dataset.id); if(!x || !downloads) return;
  btn.disabled = true; const label = btn.textContent;
  try {
    const parts = [];
    for(let i=0;i<x.parts.length;i++){
      btn.textContent = x.parts.length>1 ? `받는 중 ${i+1}/${x.parts.length}` : "받는 중…";
      const r = await fetch("/_blob/"+x.parts[i]); if(!r.ok) throw {code:"fetch"}; parts.push(await r.blob());
    }
    btn.textContent = "저장 확인…";
    const ext = x.contentType==="image/png" ? "png" : x.contentType==="image/jpeg" ? "jpg" : "mp4";
    const name = /\.(mp4|png|jpg)$/i.test(x.name) ? x.name : x.name+"."+ext;
    await downloads.save({filename: name, data: new Blob(parts)});
    toast("저장했어요");
  } catch(err){
    const c = err && err.code;
    toast(c==="declined" ? "저장을 취소했어요" : c==="fetch" ? "파일을 불러오지 못했어요. 다시 눌러 주세요" : c==="rate_limited" ? "저장 창이 이미 열려 있어요" : "저장하지 못했어요");
  } finally { btn.disabled = false; btn.textContent = label; }
}

(async () => {
  renderBoard(); renderFiles();
  try {
    const [d, dl, u] = await Promise.all([claude.use("db"), claude.use("downloads"), claude.use("user")]);
    db = d; downloads = dl;
    if(u && u.can){ const w = await u.can("data.write"); if(w===false) canWrite = false; }
  } catch(e) {}
  if(!db){ $("board").innerHTML = '<div class="empty">로그인하면 회차와 자료가 보여요.</div>'; $("files").innerHTML = ""; return; }
  db.collection("episodes").orderBy("no").onSnapshot(s => { EPS = s.docs.map(x => ({id:x.id, ...x.data()})); if(!SEL && EPS.length) SEL = (EPS.find(e=>e.status!=="up")||EPS[0]).id; renderCounts(); renderBoard(); renderDetail(); },
    () => { $("board").innerHTML = '<div class="empty">회차를 불러오지 못했어요. 새로고침해 주세요.</div>'; });
  db.collection("files").onSnapshot(s => { FILES = s.docs.map(x => ({id:x.id, ...x.data()})).sort((a,b)=>(a.order??99)-(b.order??99)); renderFiles(); },
    () => { $("files").innerHTML = '<div class="empty">자료를 불러오지 못했어요. 새로고침해 주세요.</div>'; });
  db.doc("meta/channel").onSnapshot(s => { META = s.exists ? s.data() : {}; if(META.profile) $("profile").src = "/_blob/"+META.profile; renderFiles(); });
})();
</script>
