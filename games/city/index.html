<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f3e6" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23f2d53c'/><rect x='6' y='14' width='6' height='12' fill='%231f2733'/><rect x='13' y='8' width='6' height='18' fill='%231f2733'/><rect x='20' y='17' width='6' height='9' fill='%231f2733'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;600;700&family=Jua&display=swap" />
    <meta name="description" content="강이 흐르는 빈 땅에 도로, 구역, 전기와 수도, 버스와 지하철을 놓아 키우는 로우폴리 한국 도시 건설 게임" />
    <title>한강도시</title>
  </head>
  <body>
    <canvas id="view" aria-label="도시 지도"></canvas>

    <header id="top" class="bar">
      <button id="menuBtn" class="btn icon" aria-label="메뉴 열기"><span class="burger" aria-hidden="true"></span></button>
      <div class="city">
        <div id="cityName" class="name">새솔시</div>
        <div id="date" class="date">2026년 3월 1일</div>
      </div>
      <dl class="stats">
        <div class="stat"><dt>인구</dt><dd id="pop" class="num">0</dd></div>
        <div class="stat"><dt>자금</dt><dd id="money" class="num">0</dd></div>
        <div class="stat hide-s"><dt>행복</dt><dd id="happy" class="num">없음</dd></div>
      </dl>
      <div class="rci" role="img" aria-label="주거, 상업, 산업 수요">
        <div class="bar-r"><i id="dR"></i></div>
        <div class="bar-c"><i id="dC"></i></div>
        <div class="bar-i"><i id="dI"></i></div>
        <span>주</span><span>상</span><span>산</span>
      </div>
      <div class="speed" role="group" aria-label="게임 속도">
        <button data-speed="0" aria-pressed="false">멈춤</button>
        <button data-speed="1" aria-pressed="true">1배</button>
        <button data-speed="2" aria-pressed="false">2배</button>
        <button data-speed="4" aria-pressed="false">4배</button>
      </div>
    </header>

    <aside id="goal" class="card" aria-live="polite">
      <div class="goal-head"><span class="tag">목표</span><span id="goalStep" class="num"></span><button id="goalFold" class="btn small ghost" aria-expanded="true">접기</button></div>
      <p id="goalText" class="goal-text"></p>
      <div class="goal-bar"><i id="goalBar"></i></div>
    </aside>

    <div id="toasts" aria-live="polite"></div>
    <div id="tip" class="tip" role="tooltip"></div>

    <section id="info" class="card sheet" hidden aria-label="선택한 곳 정보"></section>
    <section id="panel" class="card sheet wide" hidden></section>

    <nav id="dock" aria-label="건설 도구">
      <div id="draft" class="draft card" hidden></div>
      <div id="tools" class="tools" hidden></div>
      <div id="cats" class="cats"></div>
    </nav>

    <div id="start" class="overlay">
      <div class="card hero">
        <h1>한강도시</h1>
        <p class="lead">강이 흐르는 빈 땅에 우리 도시를 세워 보세요. 도로를 깔고 구역을 나누고 전기와 물을 대면 사람들이 이사 와요.</p>
        <label class="field" for="nameInput">도시 이름<input id="nameInput" maxlength="10" value="새솔시" autocomplete="off" /></label>
        <div class="row">
          <button id="newBtn" class="btn primary">새 도시 시작</button>
          <button id="loadBtn" class="btn" hidden>이어하기</button>
        </div>
        <dl class="howto">
          <div><dt>PC</dt><dd>좌클릭으로 건설, 우클릭 드래그로 회전, 휠로 확대, WASD로 이동</dd></div>
          <div><dt>모바일</dt><dd>한 손가락으로 건설(선택 중일 땐 이동), 두 손가락으로 이동, 확대, 회전</dd></div>
        </dl>
      </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
