<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffe9c7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍉</text></svg>" />
    <title>과일 톡톡 — 합치기 퍼즐</title>
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <div class="stat">
          <span class="label">점수</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="stat">
          <span class="label">최고</span>
          <span class="value" id="best">0</span>
        </div>
        <div class="stat next">
          <span class="label">다음</span>
          <canvas id="next" width="48" height="48"></canvas>
        </div>
        <button id="mute" class="icon-btn" aria-label="소리 켜기/끄기">🔊</button>
      </header>

      <main id="stage">
        <canvas id="board"></canvas>
      </main>

      <footer class="chain" id="chain" aria-label="과일 진화 순서"></footer>

      <div class="overlay" id="start">
        <div class="card">
          <h1>과일 톡톡</h1>
          <p>같은 과일끼리 닿으면 한 단계 큰 과일이 돼요.<br />상자가 넘치지 않게 <b>수박</b>까지 키워 보세요!</p>
          <p class="hint">드래그해서 위치를 정하고, 손을 떼면 떨어집니다.</p>
          <button class="primary" id="start-btn">시작하기</button>
        </div>
      </div>

      <div class="overlay hidden" id="over">
        <div class="card">
          <h2>게임 오버</h2>
          <p class="final" id="final-score">0</p>
          <p id="final-note"></p>
          <canvas id="final-fruit" width="96" height="96"></canvas>
          <button class="primary" id="retry-btn">다시 하기</button>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
